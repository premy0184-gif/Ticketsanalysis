<script>
(function () {
  "use strict";

  var FV = null;
  var INST = null;
  var SHIFT = null;
  var REPLACE6G = null;
  var CARD_ID = "autoAnalyticsInsights";
  var STYLE_ID = "autoAnalyticsStyle";

  function esc(v) {
    if (v === null || v === undefined) return "";
    return String(v)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function norm(v) {
    return String(v == null ? "" : v)
      .trim()
      .toLowerCase()
      .replace(/\s+/g, " ");
  }

  function key(v) {
    return norm(v).replace(/[^a-z0-9]/g, "");
  }

  function headersOf(d) {
    if (!d) return [];
    if (Array.isArray(d.headers)) return d.headers;
    if (Array.isArray(d.h)) return d.h;
    if (Array.isArray(d.r) && d.r.length && !Array.isArray(d.r[0])) {
      return Object.keys(d.r[0]);
    }
    return [];
  }

  function rowsOf(d) {
    return d && Array.isArray(d.r) ? d.r : [];
  }

  function pick(headers, names) {
    var map = {};
    headers.forEach(function (h) {
      map[key(h)] = h;
    });

    for (var i = 0; i < names.length; i++) {
      var k = key(names[i]);
      if (map[k]) return map[k];
    }

    for (var j = 0; j < headers.length; j++) {
      var hk = key(headers[j]);

      for (var x = 0; x < names.length; x++) {
        var nk = key(names[x]);

        if (
          hk === nk ||
          hk.indexOf(nk) >= 0 ||
          nk.indexOf(hk) >= 0
        ) {
          return headers[j];
        }
      }
    }

    return null;
  }

  function dateValue(v) {
    if (v === null || v === undefined || v === "") return null;

    if (v instanceof Date && !isNaN(v.getTime())) {
      return v;
    }

    if (typeof v === "number") {
      if (v > 20000 && v < 70000) {
        var excelDate =
          new Date(Date.UTC(1899, 11, 30) + v * 86400000);

        return isNaN(excelDate.getTime())
          ? null
          : excelDate;
      }
    }

    var s = String(v).trim();

    if (!s) return null;

    var m = s.match(
      /^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/
    );

    if (m) {
      var d1 = new Date(
        Number(m[1]),
        Number(m[2]) - 1,
        Number(m[3]),
        Number(m[4] || 0),
        Number(m[5] || 0),
        Number(m[6] || 0)
      );

      if (!isNaN(d1.getTime())) return d1;
    }

    var n = s.match(
      /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/
    );

    if (n) {
      var d2 = new Date(
        Number(n[3]),
        Number(n[2]) - 1,
        Number(n[1]),
        Number(n[4] || 0),
        Number(n[5] || 0),
        Number(n[6] || 0)
      );

      if (!isNaN(d2.getTime())) return d2;
    }

    var d3 = new Date(s);

    return isNaN(d3.getTime()) ? null : d3;
  }

  function dayKey(v) {
    var d = dateValue(v);

    if (!d) return "";

    return (
      d.getFullYear() +
      "-" +
      String(d.getMonth() + 1).padStart(2, "0") +
      "-" +
      String(d.getDate()).padStart(2, "0")
    );
  }

  function dayLabel(v) {
    var k = dayKey(v);

    if (!k) return "-";

    var p = k.split("-");

    return p[2] + "-" + p[1] + "-" + p[0];
  }

  function hoursBetween(a, b) {
    var d1 = dateValue(a);
    var d2 = dateValue(b);

    if (!d1 || !d2) return null;

    var h = (d2.getTime() - d1.getTime()) / 3600000;

    if (h < 0 || h > 1000) return null;

    return h;
  }

  function avg(a) {
    if (!a.length) return null;

    var total = 0;

    a.forEach(function (v) {
      total += Number(v);
    });

    return total / a.length;
  }

  function num(v, decimals) {
    if (v === null || v === undefined || isNaN(v)) {
      return "-";
    }

    return Number(v).toFixed(
      decimals === undefined ? 1 : decimals
    );
  }

  function getColumns(d) {
    var h = headersOf(d);

    return {
      solvedDate: pick(h, [
        "Solved Date",
        "SolvedDate",
        "Solved_Date",
        "Resolved Date",
        "ResolvedDate",
        "Closed Date",
        "ClosedDate",
        "Completion Date",
        "Completed Date"
      ]),

      solvedBy: pick(h, [
        "Solved By",
        "SolvedBy",
        "Solved By Name",
        "Staff",
        "Staff Name",
        "StaffName",
        "FA",
        "FA Name",
        "FAName",
        "Technician"
      ]),

      createDate: pick(h, [
        "CREATE DATE",
        "Create Date",
        "Created Date",
        "CreatedDate",
        "CRM CREATE DATE",
        "CRM Create Date",
        "CRM_CREATE_DATE",
        "Open Date",
        "Ticket Date",
        "Reported Date"
      ]),

      assignedDate: pick(h, [
        "Assigned Date",
        "AssignedDate",
        "Assign Date",
        "AssignDate",
        "Assigned At",
        "Assignment Date"
      ]),

      olt: pick(h, [
        "OLT",
        "OLT Name",
        "OLTName",
        "OltName",
        "Device",
        "Node",
        "Site"
      ]),

      customer: pick(h, [
        "Customer",
        "CustomerName",
        "Customer Name",
        "CustomerID",
        "Customer ID",
        "UserName",
        "Username",
        "Name",
        "Client",
        "Account",
        "PL",
        "Party"
      ]),

      rootCause: pick(h, [
        "Root Cause",
        "RootCause",
        "Root_Cause",
        "Cause",
        "Reason",
        "Problem Cause"
      ]),

      problem: pick(h, [
        "Problem Type",
        "ProblemType",
        "Problem_Type",
        "Issue Type",
        "IssueType",
        "Category",
        "Type"
      ]),

      solution: pick(h, [
        "Solution",
        "Resolution",
        "Solved Solution",
        "Action",
        "Remarks",
        "Fix"
      ]),

      fa: pick(h, [
        "FA",
        "FA Name",
        "FAName",
        "Field Assistant",
        "Assigned To",
        "AssignedTo",
        "Solved By",
        "SolvedBy",
        "Staff",
        "Staff Name",
        "StaffName",
        "Technician"
      ]),

      splitter: pick(h, [
        "Splitter",
        "Splitter Name",
        "SplitterName",
        "Splitter ID",
        "SplitterID",
        "Splitter Port"
      ]),

      ticket: pick(h, [
        "Ticket ID",
        "TicketID",
        "Ticket Id",
        "Ticket",
        "Ticket No",
        "TicketNo",
        "Case ID",
        "CaseID",
        "ID"
      ]),

      status: pick(h, [
        "Status",
        "TaskStatus",
        "State",
        "Completed"
      ])
    };
  }

  function value(row, col) {
    return col ? row[col] : "";
  }

  function readExistingFile(file, type) {
    return new Promise(function (resolve, reject) {
      if (!file || !window.XLSX) {
        resolve(null);
        return;
      }

      var reader = new FileReader();

      reader.onload = function (e) {
        try {
          var workbook = XLSX.read(e.target.result, {
            type: "array",
            cellDates: true,
            raw: true
          });

          var sheetName = workbook.SheetNames[0];

          if (!sheetName) {
            resolve(null);
            return;
          }

          var sheet = workbook.Sheets[sheetName];

          var matrix = XLSX.utils.sheet_to_json(sheet, {
            header: 1,
            defval: "",
            raw: true
          });

          if (!matrix.length) {
            resolve(null);
            return;
          }

          var headers = matrix[0].map(function (x) {
            return String(x == null ? "" : x).trim();
          });

          var rows = [];

          for (var i = 1; i < matrix.length; i++) {
            var arr = matrix[i];

            if (!arr) continue;

            var hasData = arr.some(function (x) {
              return x !== null &&
                x !== undefined &&
                String(x) !== "";
            });

            if (!hasData) continue;

            var obj = {};

            headers.forEach(function (h, j) {
              obj[h] =
                arr[j] === undefined ||
                arr[j] === null
                  ? ""
                  : arr[j];
            });

            rows.push(obj);
          }

          resolve({
            type: type,
            headers: headers,
            r: rows,
            fileName: file.name
          });

        } catch (err) {
          reject(err);
        }
      };

      reader.onerror = reject;

      reader.readAsArrayBuffer(file);
    });
  }

  function classifyInput(input) {
    var text = [
      input.id || "",
      input.name || "",
      input.getAttribute("data-name") || "",
      input.getAttribute("aria-label") || "",
      input.parentElement
        ? input.parentElement.innerText || ""
        : ""
    ].join(" ").toLowerCase();

    if (
      text.indexOf("field visit") >= 0 ||
      text.indexOf("field_visit") >= 0 ||
      text.indexOf("fieldvisit") >= 0
    ) {
      return "fv";
    }

    if (
      text.indexOf("installation") >= 0 ||
      text.indexOf("install") >= 0
    ) {
      return "installation";
    }

    if (
      text.indexOf("shifting") >= 0 ||
      text.indexOf("shift") >= 0
    ) {
      return "shift";
    }

    if (
      text.indexOf("6g replace") >= 0 ||
      text.indexOf("6greplace") >= 0 ||
      text.indexOf("6g_replace") >= 0 ||
      text.indexOf("replace 6g") >= 0 ||
      text.indexOf("replace6g") >= 0
    ) {
      return "replace6g";
    }

    return "";
  }

  function findInputs() {
    var inputs = Array.prototype.slice.call(
      document.querySelectorAll('input[type="file"]')
    );

    var result = {
      fv: null,
      installation: null,
      shift: null,
      replace6g: null
    };

    inputs.forEach(function (input) {
      var type = classifyInput(input);

      if (type === "fv" && !result.fv) {
        result.fv = input;
      }

      if (
        type === "installation" &&
        !result.installation
      ) {
        result.installation = input;
      }

      if (
        type === "shift" &&
        !result.shift
      ) {
        result.shift = input;
      }

      if (
        type === "replace6g" &&
        !result.replace6g
      ) {
        result.replace6g = input;
      }
    });

    return result;
  }

  function watchUploads() {
    var inputs = findInputs();

    if (inputs.fv && !inputs.fv.dataset.autoAnalytics) {
      inputs.fv.dataset.autoAnalytics = "1";

      inputs.fv.addEventListener("change", function () {
        var file =
          this.files && this.files.length
            ? this.files[0]
            : null;

        if (!file) return;

        readExistingFile(file, "fv")
          .then(function (data) {
            FV = data;
            render();
          })
          .catch(function (err) {
            console.error(
              "Field Visit file error:",
              err
            );
          });
      });
    }

    if (
      inputs.installation &&
      !inputs.installation.dataset.autoAnalytics
    ) {
      inputs.installation.dataset.autoAnalytics = "1";

      inputs.installation.addEventListener(
        "change",
        function () {
          var file =
            this.files && this.files.length
              ? this.files[0]
              : null;

          if (!file) return;

          readExistingFile(file, "installation")
            .then(function (data) {
              INST = data;
              render();
            })
            .catch(function (err) {
              console.error(
                "Installation file error:",
                err
              );
            });
        }
      );
    }

    if (
      inputs.shift &&
      !inputs.shift.dataset.autoAnalytics
    ) {
      inputs.shift.dataset.autoAnalytics = "1";

      inputs.shift.addEventListener(
        "change",
        function () {
          var file =
            this.files && this.files.length
              ? this.files[0]
              : null;

          if (!file) return;

          readExistingFile(file, "shift")
            .then(function (data) {
              SHIFT = data;
              render();
            })
            .catch(function (err) {
              console.error(
                "Shifting file error:",
                err
              );
            });
        }
      );
    }

    if (
      inputs.replace6g &&
      !inputs.replace6g.dataset.autoAnalytics
    ) {
      inputs.replace6g.dataset.autoAnalytics = "1";

      inputs.replace6g.addEventListener(
        "change",
        function () {
          var file =
            this.files && this.files.length
              ? this.files[0]
              : null;

          if (!file) return;

          readExistingFile(file, "replace6g")
            .then(function (data) {
              REPLACE6G = data;
              render();
            })
            .catch(function (err) {
              console.error(
                "6G Replace file error:",
                err
              );
            });
        }
      );
    }
  }

  function records() {
    var result = [];

    [FV, INST, SHIFT, REPLACE6G].forEach(function (data) {
      if (!data) return;

      var c = getColumns(data);

      rowsOf(data).forEach(function (row) {
        var created = value(row, c.createDate);
        var assigned = value(row, c.assignedDate);
        var solved = value(row, c.solvedDate);

        var start = assigned || created;

        result.push({
          source:
            data.type === "installation"
              ? "Installation"
              : data.type === "shift"
              ? "Shifting"
              : data.type === "replace6g"
              ? "6G Replace"
              : "Field Visit",

          ticket: value(row, c.ticket),
          customer: value(row, c.customer),
          olt: value(row, c.olt),
          splitter: value(row, c.splitter),
          rootCause: value(row, c.rootCause),
          problem: value(row, c.problem),
          solution: value(row, c.solution),
          fa: value(row, c.fa),
          solvedBy: value(row, c.solvedBy),
          status: value(row, c.status),

          createDate: created,
          assignedDate: assigned,
          solvedDate: solved,

          createDay: dayKey(created),
          solvedDay: dayKey(solved),

          solveHours:
            hoursBetween(start, solved)
        });
      });
    });

    return result;
  }

  function staffData() {
    var result = [];

    [FV, SHIFT, REPLACE6G].forEach(function (dataset) {
      if (!dataset) return;

      var c = getColumns(dataset);

      rowsOf(dataset).forEach(function (row) {
      var staff = value(row, c.solvedBy);
      var solved = value(row, c.solvedDate);

      if (!staff || !solved) return;

      var start =
        value(row, c.assignedDate) ||
        value(row, c.createDate);

        result.push({
          staff: String(staff).trim(),
          day: dayKey(solved),
          hours: hoursBetween(start, solved)
        });
      });
    });

    return result;
  }

  function staffSummary() {
    var data = staffData();
    var map = {};

    data.forEach(function (r) {
      if (!r.day) return;

      var k = r.staff + "|" + r.day;

      if (!map[k]) {
        map[k] = {
          staff: r.staff,
          day: r.day,
          solved: 0,
          hours: []
        };
      }

      map[k].solved++;

      if (r.hours !== null) {
        map[k].hours.push(r.hours);
      }
    });

    return Object.keys(map)
      .map(function (k) {
        var x = map[k];

        var totalHours =
          x.hours.reduce(function (a, b) {
            return a + b;
          }, 0);

        return {
          staff: x.staff,
          day: x.day,
          solved: x.solved,
          avgHours: avg(x.hours),
          totalHours: totalHours,
          efficiency:
            totalHours > 0
              ? x.solved / totalHours
              : null
        };
      })
      .sort(function (a, b) {
        return (
          a.day.localeCompare(b.day) ||
          a.staff.localeCompare(b.staff)
        );
      });
  }
  function staffReport() {
    var data = staffData();
    var map = {};

    data.forEach(function (r) {
      if (!map[r.staff]) {
        map[r.staff] = {
          staff: r.staff,
          solved: 0,
          hours: [],
          days: {}
        };
      }
      map[r.staff].solved++;
      if (r.hours !== null) map[r.staff].hours.push(r.hours);
      if (r.day) map[r.staff].days[r.day] = true;
    });

    function countStaff(dataset) {
      var counts = {};
      if (!dataset) return counts;
      var ci = getColumns(dataset);
      rowsOf(dataset).forEach(function (row) {
        var s = value(row, ci.solvedBy) || value(row, ci.fa);
        if (s) {
          s = String(s).trim();
          counts[s] = (counts[s] || 0) + 1;
        }
      });
      return counts;
    }

    var instCount = countStaff(INST);
    var shiftCount = countStaff(SHIFT);
    var replace6gCount = countStaff(REPLACE6G);

    return Object.keys(map)
      .map(function (k) {
        var x = map[k];
        var totalHours = x.hours.reduce(function (a, b) {
          return a + b;
        }, 0);
        var activeDays = Object.keys(x.days).length;
        var installations = instCount[x.staff] || 0;
        var shiftings = shiftCount[x.staff] || 0;
        var replace6g = replace6gCount[x.staff] || 0;
        var totalWork = x.solved + installations + shiftings + replace6g;
        return {
          staff: x.staff,
          solved: x.solved,
          installations: installations,
          shiftings: shiftings,
          replace6g: replace6g,
          totalWork: totalWork,
          activeDays: activeDays,
          avgHours: avg(x.hours),
          totalHours: totalHours,
          efficiency: totalHours > 0 ? x.solved / totalHours : null,
          ticketsPerDay: activeDays > 0 ? x.solved / activeDays : null,
          workPerDay: activeDays > 0 ? totalWork / activeDays : null
        };
      })
      .sort(function (a, b) {
        return b.totalWork - a.totalWork;
      });
  }

  function staffDatewise() {
    var data = staffData();
    var map = {};

    data.forEach(function (r) {
      if (!r.day) return;
      var k = r.staff + "|" + r.day;
      if (!map[k]) {
        map[k] = {
          staff: r.staff,
          day: r.day,
          solved: 0,
          hours: []
        };
      }
      map[k].solved++;
      if (r.hours !== null) map[k].hours.push(r.hours);
    });

    function countByDay(dataset, type) {
      if (!dataset) return;
      var ci = getColumns(dataset);
      rowsOf(dataset).forEach(function (row) {
        var s = value(row, ci.solvedBy) || value(row, ci.fa);
        var d = dayKey(value(row, ci.solvedDate) || value(row, ci.createDate));
        if (s && d) {
          var key2 = String(s).trim() + "|" + d;
          if (!map[key2]) {
            map[key2] = {
              staff: String(s).trim(),
              day: d,
              solved: 0,
              hours: []
            };
          }
          if (!map[key2][type]) map[key2][type] = 0;
          map[key2][type]++;
        }
      });
    }

    countByDay(INST, "inst");
    countByDay(SHIFT, "shift");
    countByDay(REPLACE6G, "replace6g");

    return Object.keys(map)
      .map(function (k) {
        var x = map[k];
        var totalHours = x.hours.reduce(function (a, b) {
          return a + b;
        }, 0);
        var inst = x.inst || 0;
        var shift = x.shift || 0;
        var replace6g = x.replace6g || 0;
        var total = x.solved + inst + shift + replace6g;
        return {
          staff: x.staff,
          day: x.day,
          solved: x.solved,
          installations: inst,
          shiftings: shift,
          replace6g: replace6g,
          total: total,
          avgHours: avg(x.hours),
          totalHours: totalHours,
          efficiency: totalHours > 0 ? total / totalHours : null
        };
      })
      .sort(function (a, b) {
        return (
          a.day.localeCompare(b.day) ||
          b.total - a.total
        );
      });
  }

  function daywiseSummary() {
    var map = {};

    if (FV) {
      var cf = getColumns(FV);

      rowsOf(FV).forEach(function (row) {
        var d = dayKey(value(row, cf.solvedDate));

        if (!d) return;

        if (!map[d]) {
          map[d] = {
            fv: 0,
            inst: 0
          };
        }

        map[d].fv++;
      });
    }

    if (INST) {
      var ci = getColumns(INST);

      rowsOf(INST).forEach(function (row) {
        var d = dayKey(value(row, ci.createDate));

        if (!d) return;

        if (!map[d]) {
          map[d] = {
            fv: 0,
            inst: 0
          };
        }

        map[d].inst++;
      });
    }

    return Object.keys(map)
      .sort()
      .map(function (d) {
        return [
          dayLabel(d),
          map[d].fv,
          map[d].inst,
          map[d].fv + map[d].inst
        ];
      });
  }

  function countGroup(data, fn) {
    var map = {};

    data.forEach(function (r) {
      var k = fn(r);

      if (!k) k = "Unknown";

      if (!map[k]) map[k] = 0;

      map[k]++;
    });

    return Object.keys(map)
      .map(function (k) {
        return {
          name: k,
          count: map[k]
        };
      })
      .sort(function (a, b) {
        return b.count - a.count;
      });
  }

  function oltHealth(data) {
    var map = {};

    data.forEach(function (r) {
      if (!r.olt) return;

      var k = String(r.olt).trim();

      if (!map[k]) {
        map[k] = {
          olt: k,
          tickets: 0,
          hours: [],
          over24: 0,
          customers: {}
        };
      }

      map[k].tickets++;

      if (r.solveHours !== null) {
        map[k].hours.push(r.solveHours);

        if (r.solveHours > 24) {
          map[k].over24++;
        }
      }

      if (r.customer) {
        map[k].customers[r.customer] =
          (map[k].customers[r.customer] || 0) + 1;
      }
    });

    return Object.keys(map)
      .map(function (k) {
        var x = map[k];

        var repeat = Object.keys(x.customers)
          .filter(function (c) {
            return x.customers[c] > 1;
          }).length;

        var average = avg(x.hours);

        var score = 100;

        if (average !== null) {
          score -= Math.min(40, average * 2);
        }

        score -= Math.min(30, x.over24 * 5);
        score -= Math.min(20, repeat * 3);

        score = Math.max(0, Math.round(score));

        return [
          x.olt,
          x.tickets,
          num(average, 1),
          x.over24,
          repeat,
          score + "/100"
        ];
      })
      .sort(function (a, b) {
        return parseInt(a[5]) - parseInt(b[5]);
      });
  }

  function rootPareto(data) {
    var grouped = countGroup(data, function (r) {
      return r.rootCause || "Unknown";
    });

    var total = data.length;
    var running = 0;

    return grouped.map(function (x) {
      running += x.count;

      return [
        x.name,
        x.count,
        total
          ? ((x.count / total) * 100).toFixed(1) + "%"
          : "0%",
        total
          ? ((running / total) * 100).toFixed(1) + "%"
          : "0%"
      ];
    });
  }

  function faWorkload(data) {
    var grouped = countGroup(data, function (r) {
      return r.fa || r.solvedBy || "Unknown";
    });

    return grouped.map(function (x) {
      var hrs = [];

      data.forEach(function (r) {
        var person =
          r.fa || r.solvedBy || "Unknown";

        if (person === x.name && r.solveHours !== null) {
          hrs.push(r.solveHours);
        }
      });

      return [
        x.name,
        x.count,
        num(avg(hrs), 1)
      ];
    });
  }

  function splitterTrend(data) {
    var map = {};

    data.forEach(function (r) {
      var d = r.solvedDay || r.createDay;

      if (!d) return;

      var splitter = r.splitter || "Unknown";

      var k = d + "|" + splitter;

      if (!map[k]) {
        map[k] = {
          day: d,
          splitter: splitter,
          count: 0
        };
      }

      map[k].count++;
    });

    return Object.keys(map)
      .map(function (k) {
        return [
          dayLabel(map[k].day),
          map[k].splitter,
          map[k].count
        ];
      })
      .sort(function (a, b) {
        return a[0].localeCompare(b[0]);
      });
  }

  function splitterCascade(data) {
    var map = {};

    data.forEach(function (r) {
      var splitter = r.splitter || "Unknown";
      var olt = r.olt || "Unknown";

      var k = splitter + "|" + olt;

      if (!map[k]) {
        map[k] = {
          splitter: splitter,
          olt: olt,
          count: 0
        };
      }

      map[k].count++;
    });

    return Object.keys(map)
      .map(function (k) {
        return [
          map[k].splitter,
          map[k].olt,
          map[k].count
        ];
      })
      .sort(function (a, b) {
        return b[2] - a[2];
      });
  }

  function customerStats(data) {
    var map = {};

    data.forEach(function (r) {
      var c = r.customer || "Unknown";

      if (!map[c]) map[c] = 0;

      map[c]++;
    });

    var customers = Object.keys(map);

    var repeat = customers.filter(function (c) {
      return map[c] > 1;
    }).length;

    var chronic = customers.filter(function (c) {
      return map[c] >= 3;
    }).length;

    return {
      total: customers.length,
      firstTime: customers.length - repeat,
      repeat: repeat,
      chronic: chronic
    };
  }

  function ticketHistory(data) {
    return data
      .slice()
      .sort(function (a, b) {
        return (
          (b.solvedDay || b.createDay || "")
            .localeCompare(
              a.solvedDay || a.createDay || ""
            )
        );
      })
      .slice(0, 500)
      .map(function (r) {
        return [
          r.source,
          r.ticket || "-",
          r.customer || "-",
          r.olt || "-",
          dayLabel(r.createDate || r.assignedDate),
          dayLabel(r.solvedDate),
          r.solvedBy || r.fa || "-",
          r.problem || "-",
          r.solution || "-"
        ];
      });
  }

  function problemData(data) {
    return countGroup(data, function (r) {
      return r.problem || "Unknown";
    }).map(function (x) {
      return [x.name, x.count];
    });
  }

  function solutionData(data) {
    return countGroup(data, function (r) {
      return r.solution || "Unknown";
    }).map(function (x) {
      return [x.name, x.count];
    });
  }

  function solveStats(data) {
    var valid = data.filter(function (r) {
      return r.solveHours !== null;
    });

    var hours = valid.map(function (r) {
      return r.solveHours;
    });

    return {
      count: valid.length,
      average: avg(hours),
      under4: valid.filter(function (r) {
        return r.solveHours <= 4;
      }).length,
      over24: valid.filter(function (r) {
        return r.solveHours > 24;
      }).length
    };
  }

  function table(headers, rows, opts) {
    opts = opts || {};
    var html =
      '<div class="aa-table-wrap">' +
      "<table>" +
      "<thead><tr>";

    headers.forEach(function (h) {
      html += "<th>" + esc(h) + "</th>";
    });

    html += "</tr></thead><tbody>";

    if (!rows.length) {
      html +=
        '<tr><td colspan="' +
        headers.length +
        '" class="aa-empty">No data</td></tr>';
    } else {
      rows.forEach(function (row) {
        html += "<tr>";

        row.forEach(function (cell, ci) {
          var style = "";
          var content = cell;
          if (opts.efficiencyCols && opts.efficiencyCols.indexOf(ci) >= 0) {
            var nv = parseFloat(cell);
            if (!isNaN(nv)) {
              if (nv >= 6) {
                style = ' style="background:#dcfce7;color:#16a34a;font-weight:700;"';
              } else {
                style = ' style="background:#fef2f2;color:#dc2626;font-weight:700;"';
              }
            }
          }
          if (cell === null || cell === undefined || cell === "-") {
            content = "-";
          }
          html += "<td" + style + ">" + esc(content) + "</td>";
        });

        html += "</tr>";
      });
    }

    html += "</tbody></table></div>";

    return html;
  }

  function section(title, content) {
    return (
      '<div class="aa-section">' +
      '<div class="aa-section-title">' +
      esc(title) +
      "</div>" +
      content +
      "</div>"
    );
  }

  function findInsights() {
    var nodes = document.querySelectorAll(
      "h1,h2,h3,h4,h5,.card,.panel,.section"
    );

    for (var i = 0; i < nodes.length; i++) {
      var text = (
        nodes[i].innerText || ""
      ).trim().toLowerCase();

      if (text === "insights") {
        return nodes[i];
      }

      if (
        text.indexOf("insights") >= 0 &&
        text.length < 150
      ) {
        return nodes[i];
      }
    }

    return null;
  }

      var parts = [];
      if (FV) parts.push("Field Visit: " + rowsOf(FV).length + " rows");
      if (INST) parts.push("Installation: " + rowsOf(INST).length + " rows");
      if (SHIFT) parts.push("Shifting: " + rowsOf(SHIFT).length + " rows");
      if (REPLACE6G) parts.push("6G Replace: " + rowsOf(REPLACE6G).length + " rows");
      statusEl.textContent = parts.length ? parts.join(" | ") : "प्रत्येक file छुट्टाछुट्टै upload गर्नुहोस्।";

      var fvLabel = document.getElementById("aa-btn-fv");
      var instLabel = document.getElementById("aa-btn-inst");
      var shiftLabel = document.getElementById("aa-btn-shift");
      var replace6gLabel = document.getElementById("aa-btn-replace6g");
      if (fvLabel) fvLabel.className = "aa-upload-btn" + (FV ? " active" : "");
      if (instLabel) instLabel.className = "aa-upload-btn" + (INST ? " active" : "");
      if (shiftLabel) shiftLabel.className = "aa-upload-btn" + (SHIFT ? " active" : "");
      if (replace6gLabel) replace6gLabel.className = "aa-upload-btn" + (REPLACE6G ? " active" : "");
    }

    if (fvBtn) {
      fvBtn.addEventListener("change", function () {
        var file = this.files && this.files.length ? this.files[0] : null;
        if (!file) return;
        loadXLSX(function () {
          readExistingFile(file, "fv")
            .then(function (data) { FV = data; updateStatus(); render(); })
            .catch(function (err) { console.error("FV file error:", err); });
        });
      });
    }

    if (instBtn) {
      instBtn.addEventListener("change", function () {
        var file = this.files && this.files.length ? this.files[0] : null;
        if (!file) return;
        loadXLSX(function () {
          readExistingFile(file, "installation")
            .then(function (data) { INST = data; updateStatus(); render(); })
            .catch(function (err) { console.error("Installation file error:", err); });
        });
      });
    }

    if (shiftBtn) {
      shiftBtn.addEventListener("change", function () {
        var file = this.files && this.files.length ? this.files[0] : null;
        if (!file) return;
        loadXLSX(function () {
          readExistingFile(file, "shift")
            .then(function (data) { SHIFT = data; updateStatus(); render(); })
            .catch(function (err) { console.error("Shifting file error:", err); });
        });
      });
    }

    if (replace6gBtn) {
      replace6gBtn.addEventListener("change", function () {
        var file = this.files && this.files.length ? this.files[0] : null;
        if (!file) return;
        loadXLSX(function () {
          readExistingFile(file, "replace6g")
            .then(function (data) { REPLACE6G = data; updateStatus(); render(); })
            .catch(function (err) { console.error("6G Replace file error:", err); });
        });
      });
    }

    if (clearBtn) {
      clearBtn.addEventListener("click", function () {
        FV = null; INST = null; SHIFT = null; REPLACE6G = null;
        if (fvBtn) fvBtn.value = "";
        if (instBtn) instBtn.value = "";
        if (shiftBtn) shiftBtn.value = "";
        if (replace6gBtn) replace6gBtn.value = "";
        updateStatus();
        render();
      });
    }

    updateStatus();
  }

  function render() {
    insertCard();
    setupUploadButtons();

    var content =
      document.getElementById("aa-content");

    if (!content) return;

    if (!FV && !INST && !SHIFT && !REPLACE6G) {
      content.innerHTML =
        '<div class="aa-loading">' +
        "Field Visit, Installation, Shifting वा 6G Replace file upload गर्नुहोस्।" +
        "</div>";

      return;
    }

    content.innerHTML = build();
  }

  function loadXLSX(callback) {
    if (window.XLSX) {
      callback();
      return;
    }

    var script =
      document.createElement("script");

    script.src =
      "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";

    script.onload = callback;

    script.onerror = function () {
      console.error(
        "XLSX library load failed"
      );
    };

    document.head.appendChild(script);
  }

  function addStyle() {
    if (document.getElementById(STYLE_ID)) {
      return;
    }

    var style =
      document.createElement("style");

    style.id = STYLE_ID;

    style.textContent =
      ".aa-upload-area{margin-bottom:18px;padding:15px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:11px;}" +
      ".aa-upload-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px;}" +
      ".aa-upload-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border:2px dashed #94a3b8;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;background:#fff;color:#374151;transition:all .2s;}" +
      ".aa-upload-btn:hover{border-color:#2563eb;background:#eff6ff;}" +
      ".aa-upload-btn.active{border-color:#16a34a;background:#f0fdf4;color:#16a34a;}" +
      ".aa-upload-btn input{display:none;}" +
      ".aa-upload-status{font-size:11px;color:#6b7280;margin-top:4px;}" +
      ".aa-upload-clear{padding:6px 12px;border:1px solid #e5e7eb;border-radius:6px;cursor:pointer;font-size:12px;background:#fff;color:#6b7280;}" +
      ".aa-upload-clear:hover{background:#fef2f2;color:#dc2626;border-color:#dc2626;}" +
      "#autoAnalyticsInsights{" +
      "margin:30px 0;" +
      "padding:24px;" +
      "background:linear-gradient(180deg,#f8fafc 0%,#fff 100%);" +
      "border:1px solid #e2e8f0;" +
      "border-radius:20px;" +
      "box-shadow:0 12px 48px rgba(0,0,0,.10);" +
      "font-family:'Segoe UI',system-ui,Arial,sans-serif;" +
      "color:#111827;" +
      "}" +

      ".aa-header{" +
      "display:flex;" +
      "justify-content:space-between;" +
      "align-items:center;" +
      "gap:10px;" +
      "flex-wrap:wrap;" +
      "font-size:22px;" +
      "margin-bottom:20px;" +
      "padding:16px 20px;" +
      "background:linear-gradient(135deg,#1e3a8a,#2563eb);" +
      "border-radius:14px;" +
      "box-shadow:0 4px 16px rgba(37,99,235,.25);" +
      "}" +

      ".aa-header b{color:#fff;font-weight:800;letter-spacing:.5px;}" +

      ".aa-header span{" +
      "font-size:12px;" +
      "color:#bfdbfe;" +
      "padding-top:6px;" +
      "font-weight:500;" +
      "}" +

      ".aa-kpis{" +
      "display:grid;" +
      "grid-template-columns:repeat(auto-fit,minmax(150px,1fr));" +
      "gap:12px;" +
      "margin-bottom:22px;" +
      "}" +

      ".aa-kpi{" +
      "background:linear-gradient(135deg,#f8fafc,#fff);" +
      "border:1px solid #e2e8f0;" +
      "border-radius:13px;" +
      "padding:16px;" +
      "transition:transform .2s,box-shadow .2s;" +
      "box-shadow:0 1px 4px rgba(0,0,0,.04);" +
      "}" +

      ".aa-kpi:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.10);}" +

      ".aa-kpi b{" +
      "display:block;" +
      "font-size:26px;" +
      "margin-bottom:4px;" +
      "color:#1e3a8a;" +
      "font-weight:800;" +
      "}" +

      ".aa-kpi span{" +
      "font-size:11px;" +
      "color:#64748b;" +
      "font-weight:600;" +
      "text-transform:uppercase;" +
      "letter-spacing:.5px;" +
      "}" +

      ".aa-section{" +
      "border:1px solid #e2e8f0;" +
      "border-radius:14px;" +
      "margin:18px 0;" +
      "overflow:hidden;" +
      "background:#fff;" +
      "box-shadow:0 2px 12px rgba(0,0,0,.04);" +
      "}" +

      ".aa-section-title{" +
      "font-weight:700;" +
      "font-size:15px;" +
      "padding:14px 18px;" +
      "background:linear-gradient(90deg,#1e3a8a,#2563eb);" +
      "color:#fff;" +
      "letter-spacing:.3px;" +
      "box-shadow:0 1px 4px rgba(37,99,235,.15);" +
      "}" +

      ".aa-table-wrap{" +
      "width:100%;" +
      "overflow:auto;" +
      "max-height:500px;" +
      "}" +

      ".aa-section table{" +
      "width:100%;" +
      "border-collapse:collapse;" +
      "min-width:650px;" +
      "font-size:12px;" +
      "}" +

      ".aa-section th," +
      ".aa-section td{" +
      "padding:9px 11px;" +
      "border-bottom:1px solid #f1f5f9;" +
      "text-align:left;" +
      "vertical-align:top;" +
      "}" +

      ".aa-section th{" +
      "font-weight:700;" +
      "background:#f1f5f9;" +
      "color:#1e3a8a;" +
      "white-space:nowrap;" +
      "text-transform:uppercase;" +
      "font-size:11px;" +
      "letter-spacing:.5px;" +
      "position:sticky;" +
      "top:0;" +
      "z-index:1;" +
      "}" +

      ".aa-section tr:hover td{background:#f8fafc;}" +

      ".aa-section tr:nth-child(even) td{background:#fcfcfd;}" +

      ".aa-stats{" +
      "display:flex;" +
      "gap:20px;" +
      "flex-wrap:wrap;" +
      "padding:15px;" +
      "font-size:13px;" +
      "}" +

      ".aa-big{" +
      "font-size:36px;" +
      "font-weight:800;" +
      "padding:20px;" +
      "color:#1e3a8a;" +
      "}" +

      ".aa-note{" +
      "padding:0 18px 16px;" +
      "font-size:12px;" +
      "color:#64748b;" +
      "}" +

      ".aa-loading," +
      ".aa-empty{" +
      "padding:30px;" +
      "text-align:center;" +
      "color:#64748b;" +
      "font-size:14px;" +
      "}";

    document.head.appendChild(style);
  }

  function start() {
    addStyle();

    loadXLSX(function () {
      insertCard();
      watchUploads();
      render();
    });

    var observer =
      new MutationObserver(function () {
        addStyle();
        watchUploads();
        insertCard();
      });

    observer.observe(
      document.documentElement,
      {
        childList: true,
        subtree: true
      }
    );

    setInterval(function () {
      watchUploads();
      insertCard();
    }, 2000);
  }

  if (
    document.readyState === "loading"
  ) {
    document.addEventListener(
      "DOMContentLoaded",
      start
    );
  } else {
    start();
  }

})();
</script>

<style>
#autoInsightsButton{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:999999;
  border:0;
  border-radius:30px;
  padding:12px 18px;
  background:#111827;
  color:#fff;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,.25);
}
</style>

<button
  id="autoInsightsButton"
  onclick="window.scrollTo({
    top:document.body.scrollHeight,
    behavior:'smooth'
  })"
>
  📊 Insights
</button>
</body>
</html>
