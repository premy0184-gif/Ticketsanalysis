/* ===== Assign→Solve Time — by Problem Type/Solution and by FA =====
   Measures the real hands-on turnaround: from when a ticket was Last Assigned to a team
   until it was actually Solved (not from when the customer first opened it). Needs the
   "Last Assigned Date" column mapped on the Field Visit upload; hour-level accuracy also
   needs "Solved Time" mapped, otherwise gaps are date-only (whole-day) estimates. */
function computeAssignSolveRows(){
  return (state.datasets.fieldvisit||[]).map(row=>{
    if(!passesNepFilter(row.solvedDate)) return null;
    const assigned=parseDateVal(row.lastAssignedDate);
    const solved=parseDateVal(row.solvedDate);
    if(!assigned||!solved) return null;
    const hrs=(solved-assigned)/3600000;
    if(hrs<0) return null;
    return {
      problemType: row.problemType?normalizeDiag(row.problemType):"(blank)",
      solution: row.solution?normalizeDiag(row.solution):"(blank)",
      fa: row.solvedBy||"Unknown",
      hrs
    };
  }).filter(Boolean);
}
function aggregateAssignSolve(rows,topKeyFn,subKeyFn){
  const byTop={};
  rows.forEach(row=>{
    const top=topKeyFn(row);
    if(!byTop[top]) byTop[top]={count:0,hrSum:0,sub:{}};
    byTop[top].count++;
    byTop[top].hrSum+=row.hrs;
    const sub=subKeyFn(row);
    if(!byTop[top].sub[sub]) byTop[top].sub[sub]={count:0,hrSum:0};
    byTop[top].sub[sub].count++;
    byTop[top].sub[sub].hrSum+=row.hrs;
  });
  return Object.entries(byTop).map(([label,g])=>({
    label,count:g.count,avgHr:g.hrSum/g.count,
    subs:Object.entries(g.sub).map(([slabel,sg])=>({label:slabel,count:sg.count,avgHr:sg.hrSum/sg.count})).sort((a,b)=>b.avgHr-a.avgHr)
  })).sort((a,b)=>b.avgHr-a.avgHr);
}

/* ===== Team Calculation — demand & supply / work-hour planning tool =====
   Standalone planning calculator (not tied to uploaded ticket data): projects how many
   field teams are needed to clear pending tasks within the remaining shift hours. */
function computeTeamCalc(){
  const tc=state.teamCalc;
  const toHrs=t=>{ if(!t) return 0; const parts=t.split(":"); const h=parseFloat(parts[0])||0; const m=parseFloat(parts[1])||0; return h+m/60; };
  const incPerHr=parseFloat(tc.incPerHr)||0;
  const pendingTask=parseFloat(tc.pendingTask)||0;
  const breakTime1=parseFloat(tc.breakTime1)||0;
  const extraMinus1=parseFloat(tc.extraMinus1)||0;
  const workHour=Math.max(0, toHrs(tc.endTime)-toHrs(tc.startTime));
  const incPct=incPerHr*workHour;
  const projTask=Math.ceil(pendingTask*(1+incPct/100));
  const remWorkHour=Math.max(0, workHour-breakTime1-extraMinus1);
  const supplyTeam=remWorkHour>0 ? Math.ceil(projTask/remWorkHour) : 0;

  const onlineTeam=parseFloat(tc.onlineTeam)||0;
  const workingTime=parseFloat(tc.workingTime)||0;
  const breakTime2=parseFloat(tc.breakTime2)||0;
  const extraMinus2=parseFloat(tc.extraMinus2)||0;
  const remPerTeam=Math.max(0, workingTime-breakTime2-extraMinus2);
  const totalAvail=remPerTeam*onlineTeam;

  return {workHour,incPct,projTask,remWorkHour,supplyTeam,remPerTeam,totalAvail};
}
/* ===== FVR% (Fault/Visit Rate) calculator — current-month average + projected month-end rate ===== */
function computeCurrentMonthAvgTicket(){
  const monthsWithData=computeMonthsWithData("solvedDate");
  if(!monthsWithData.length) return null;
  const currentMonth=monthsWithData[monthsWithData.length-1];
  const currYear=nepMonthYearOf(currentMonth);
  if(currYear==null) return null;
  let count=0, asOfDay=0;
  (state.datasets.fieldvisit||[]).forEach(r=>{
    const d=parseDateVal(r.solvedDate);
    if(!d) return;
    const ni=nepInfo(ymd(d));
    if(!ni||ni.month!==currentMonth||ni.year!==currYear) return;
    count++;
    const day=parseInt((ni.nep.split("/")[2]||"0"),10);
    if(day>asOfDay) asOfDay=day;
  });
  const totalDaysCurr=totalDaysInNepMonth(currentMonth,currYear);
  const avgPerDay = asOfDay>0 ? count/asOfDay : 0;
  return {currentMonth,currYear,count,asOfDay,avgPerDay,totalDaysCurr};
}
function computeFvr(){
  const cm=computeCurrentMonthAvgTicket();
  const fv=state.fvrCalc;
  const totalDaysCurr = cm ? cm.totalDaysCurr : 30;
  const projTicketPerDay=parseFloat(fv.projTicketPerDay)||0;
  const activeCustomer=parseFloat(fv.activeCustomer)||0;
  const projectedTotalTT=Math.round(projTicketPerDay*totalDaysCurr);
  const fvrPct = activeCustomer>0 ? 100*projectedTotalTT/activeCustomer : 0;
  return {cm,totalDaysCurr,projectedTotalTT,fvrPct};
}
/* Live-updates just the computed output <span>s for Team Calc / FVR% without a full
   render() — a full render on every keystroke was rebuilding the number inputs' DOM
   nodes, which reset the text cursor to the start (letters typed in reverse) and closed
   the native time picker mid-selection. Reading/writing state still happens on every
   keystroke; only the DOM rebuild is skipped until the user leaves this tab. */
function updateTeamCalcOutputs(){
  const c=computeTeamCalc();
  const fvr=computeFvr();
  const setText=(id,text)=>{ const el=document.getElementById(id); if(el) el.textContent=text; };
  setText("tc-out-incPct", Math.round(c.incPct)+"%");
  setText("tc-out-projTask", c.projTask);
  setText("tc-out-workHour", c.workHour.toFixed(2));
  setText("tc-out-remWorkHour", c.remWorkHour.toFixed(2));
  setText("tc-out-supplyTeam", c.supplyTeam);
  setText("fvr-out-projectedTotalTT", fvr.projectedTotalTT);
  setText("fvr-out-fvrPct", fvr.fvrPct.toFixed(2)+"%");
}
/* =========================================================
   SHIFT PLANNER — plan team coverage across shifts against
   expected ticket volume and a manually-defined arrival-time
   distribution. Every number here is a manual assumption the
   user types in (not derived from uploaded data) — editing
   any input recalculates everything downstream from it.
   ========================================================= */
function spTimeToMin(hhmm){
  if(!hhmm) return 0;
  const [h,m]=hhmm.split(":").map(Number);
  return (h||0)*60+(m||0);
}
function spMinToLabel(mins,forceSuffix){
  mins=((mins%1440)+1440)%1440;
  let h=Math.floor(mins/60), m=mins%60;
  const ap=h<12?"AM":"PM";
  let h12=h%12; if(h12===0) h12=12;
  const timePart=`${h12}:${String(m).padStart(2,"0")}`;
  return forceSuffix===false ? timePart : `${timePart} ${ap}`;
}
function spPeriodLabel(period){
  const s=spTimeToMin(period.start), e=spTimeToMin(period.end);
  const apS=s<720?"AM":"PM", apE=e<720?"AM":"PM"; /* noon(720)+ counts as PM, matches 12:00 PM */
  const sameAp=apS===apE;
  return `${spMinToLabel(s,!sameAp)}–${spMinToLabel(e,true)}`;
}
function spShiftWorkingMinutes(shift){
  return Math.max(0,(spTimeToMin(shift.end)-spTimeToMin(shift.start))-(parseFloat(shift.breakMin)||0));
}
function spShiftStats(shift,avgTaskTimeMinutes){
  const workingMin=spShiftWorkingMinutes(shift);
  const ticketsPerTeam=avgTaskTimeMinutes>0?workingMin/avgTaskTimeMinutes:0;
  const teams=parseFloat(shift.teams)||0;
  return {workingHrs:workingMin/60,ticketsPerTeam,totalTickets:ticketsPerTeam*teams};
}
function spPeriodStats(period,shifts,avgTicketsPerDay,avgTaskTimeMinutes){
  const pStart=spTimeToMin(period.start), pEnd=spTimeToMin(period.end);
  const periodLen=Math.max(0,pEnd-pStart);
  const pct=parseFloat(period.pct)||0;
  const expectedTickets=pct/100*avgTicketsPerDay;
  const requiredTeams=periodLen>0?(expectedTickets*avgTaskTimeMinutes)/periodLen:0;
  let availMin=0;
  shifts.forEach(s=>{
    const sStart=spTimeToMin(s.start), sEnd=spTimeToMin(s.end);
    let overlap=Math.max(0,Math.min(sEnd,pEnd)-Math.max(sStart,pStart));
    const breakMin=parseFloat(s.breakMin)||0;
    if(overlap>0 && breakMin>0){
      const bStart=spTimeToMin(s.breakStart), bEnd=bStart+breakMin;
      const breakOverlap=Math.max(0,Math.min(bEnd,Math.min(sEnd,pEnd))-Math.max(bStart,Math.max(sStart,pStart)));
      overlap=Math.max(0,overlap-breakOverlap);
    }
    availMin+=overlap*(parseFloat(s.teams)||0);
  });
  const availableTeams=periodLen>0?availMin/periodLen:0;
  return {period,periodLen,expectedTickets,requiredTeams,availableTeams,gap:availableTeams-requiredTeams};
}
function spShiftsWithScenarioTeams(shifts,scenario){
  return shifts.map(s=>{
    const key = s.id==="A"?"teamsA":s.id==="B"?"teamsB":"teamsC";
    return {...s, teams: scenario[key]!=null?scenario[key]:s.teams};
  });
}
/* --- Real-data auto-fill: derive avg tickets/day and an hourly shape from the actual
   uploaded Field Visit (Issued Time) + New Installation data, instead of guessing. --- */
function computeRealDataForShiftPlanner(){
  const fv=(state.datasets.fieldvisit||[]).filter(row=>passesNepFilter(row.openDate||row.solvedDate));
  const hourCounts=new Array(24).fill(0);
  const daysSet=new Set();
  let withHour=0;
  fv.forEach(row=>{
    const od=parseDateVal(row.openDate);
    if(!od) return;
    hourCounts[od.getHours()]++;
    daysSet.add(ymd(od));
    withHour++;
  });
  const dayCount=daysSet.size||1;
  const hourlyAvg=hourCounts.map(c=>c/dayCount);
  const troubleshootPerDay=hourlyAvg.reduce((s,v)=>s+v,0);
  const inst=(state.datasets.installation||[]).filter(row=>passesNepFilter(row.createDate));
  const instDaysSet=new Set();
  inst.forEach(row=>{ const cd=parseDateVal(row.createDate); if(cd) instDaysSet.add(ymd(cd)); });
  const instDayCount=instDaysSet.size||1;
  const instAvgPerDay=inst.length/instDayCount;
  return {hourlyAvg, avgTicketsPerDay:troubleshootPerDay+instAvgPerDay, dayCount, withHour};
}
function spPeriodHourlySum(period,hourlyAvg){
  const s=spTimeToMin(period.start), e=spTimeToMin(period.end);
  let sum=0;
  for(let h=0;h<24;h++){
    const overlap=Math.max(0,Math.min((h+1)*60,e)-Math.max(h*60,s));
    if(overlap>0) sum+=hourlyAvg[h]*(overlap/60);
  }
  return sum;
}
/* --- Continuous coverage timeline: Required vs Available as two overlaid lines across
   the periods (rather than the side-by-side bar panels), so gaps are visible at a glance. --- */
function spCoverageTimelineChart(periodStats){
  if(!periodStats.length) return `<div class="mini-bars-empty">No periods defined</div>`;
  const w=Math.max(320,60+periodStats.length*90), h=140;
  const padL=36,padR=16,padT=16,padB=30;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const maxV=Math.max(1,...periodStats.map(ps=>Math.max(ps.requiredTeams,ps.availableTeams)));
  const stepX=periodStats.length>1?plotW/(periodStats.length-1):0;
  const xAt=i=>padL+stepX*i;
  const yAt=v=>padT+plotH-(v/maxV)*plotH;
  const pathFor=key=>periodStats.map((ps,i)=>`${i===0?'M':'L'}${xAt(i).toFixed(1)},${yAt(ps[key]).toFixed(1)}`).join(" ");
  const reqPath=pathFor("requiredTeams"), availPath=pathFor("availableTeams");
  return `<div style="overflow-x:auto;">
    <svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="display:block;">
      <path d="${availPath}" fill="none" stroke="#16A34A" stroke-width="2.5"></path>
      <path d="${reqPath}" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="5,3"></path>
      ${periodStats.map((ps,i)=>`
        <circle cx="${xAt(i).toFixed(1)}" cy="${yAt(ps.availableTeams).toFixed(1)}" r="3" fill="#16A34A"></circle>
        <circle cx="${xAt(i).toFixed(1)}" cy="${yAt(ps.requiredTeams).toFixed(1)}" r="3" fill="#DC2626"></circle>
        ${ps.gap<0?`<rect x="${(xAt(i)-6).toFixed(1)}" y="${Math.min(yAt(ps.availableTeams),yAt(ps.requiredTeams)).toFixed(1)}" width="12" height="${Math.abs(yAt(ps.availableTeams)-yAt(ps.requiredTeams)).toFixed(1)}" fill="#DC2626" opacity="0.12"></rect>`:""}
        <text x="${xAt(i).toFixed(1)}" y="${h-10}" font-size="9.5" text-anchor="middle" fill="var(--sub)">${esc(spPeriodLabel(ps.period))}</text>
      `).join("")}
    </svg>
    <div style="display:flex;gap:16px;margin-top:6px;font-size:11.5px;">
      <span><span style="display:inline-block;width:14px;height:2.5px;background:#16A34A;vertical-align:middle;margin-right:4px;"></span>Available Teams</span>
      <span><span style="display:inline-block;width:14px;height:2.5px;background:#DC2626;vertical-align:middle;margin-right:4px;border-top:2.5px dashed #DC2626;"></span>Required Teams</span>
      <span style="color:var(--sub);">Shaded = shortfall</span>
    </div>
  </div>`;
}

/* ===== Monthly PPT Report — auto-builds a PowerPoint from every report in this app,
   scoped to whatever Nepali Year/Month is currently selected in the Reports date filter.
   Uses PptxGenJS (loaded via CDN) entirely client-side — no server involved. Reuses the
   exact same compute* functions the on-screen reports use, so the numbers always match. */
function computePerformanceSummary(){
  const m=state.columnMaps.fieldvisit||{};
  const fvAll=(state.datasets.fieldvisit||[]).filter(r=>passesNepFilter(r.solvedDate));
  const solvedRows=fvAll.filter(r=>parseDateVal(r.solvedDate));
  const totalSolved=solvedRows.length;
  const hasOpenDate=m.openDate!==null&&m.openDate!==undefined;
  const withBothDates=hasOpenDate?solvedRows.filter(r=>parseDateVal(r.openDate)&&parseDateVal(r.solvedDate)):[];
  const durations=withBothDates.map(r=>daysBetween(parseDateVal(r.openDate),parseDateVal(r.solvedDate)));
  const sameDaySolved=durations.filter(d=>d===0).length;
  const sameDayPct=durations.length?Math.round(100*sameDaySolved/durations.length):null;
  const hasSolveDurHr=m.solveDurHr!==null&&m.solveDurHr!==undefined;
  const durHrValues=hasSolveDurHr?solvedRows.map(r=>parseFloat(r.solveDurHr)).filter(n=>!isNaN(n)):[];
  const overallAvgHr=durHrValues.length?durHrValues.reduce((s,n)=>s+n,0)/durHrValues.length:null;
  const slaBreach24=hasSolveDurHr?solvedRows.filter(r=>{const h=parseFloat(r.solveDurHr);return !isNaN(h)&&h>24;}).length:0;
  const slaBreach48=hasSolveDurHr?solvedRows.filter(r=>{const h=parseFloat(r.solveDurHr);return !isNaN(h)&&h>48;}).length:0;
  return {totalSolved,sameDaySolved,sameDayPct,overallAvgHr,slaBreach24,slaBreach48};
}
function ensurePptxLib(){
  if(typeof PptxGenJS!=="undefined") return Promise.resolve();
  return new Promise((resolve,reject)=>{
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js";
    s.onload=()=>{ if(typeof PptxGenJS!=="undefined") resolve(); else reject(new Error("PPT library loaded but PptxGenJS is still undefined — the file may be a different build than expected.")); };
    s.onerror=()=>reject(new Error("Could not load the PPT library from either source. Check your internet connection and try again."));
    document.head.appendChild(s);
  });
}
async function generateMonthlyPptx(){
  const btn=document.querySelector('[data-action="generate-monthly-pptx"]');
  const origLabel=btn?btn.textContent:"";
  try{
    if(btn){ btn.disabled=true; btn.textContent="⏳ Generating PPT…"; }

  const r=state.reports;
  const monthLabel=[r.fMonth,r.fYear].filter(Boolean).join(" ")||"All Time";
  const PRIMARY="1D4ED8", INK="1F2937", SUB="6B7280";
  const pptx=new PptxGenJS();
  pptx.layout="LAYOUT_WIDE";
  const addSectionTitle=(s,title,subtitle)=>{
    s.addText(title,{x:0.5,y:0.32,w:12.3,h:0.6,fontSize:22,bold:true,color:INK});

      .concat(rows.map(row=>row.map(c=>({text:String(c==null?"—":c),options:{fontSize:10.5,color:INK}}))));
    s.addTable(body,Object.assign({x:0.5,y:1.35,w:12.3,autoPage:false,border:{type:"solid",color:"E5E7EB",pt:0.5},valign:"middle"},opts||{}));
  };

  /* Title slide */
  {
    const s=pptx.addSlide();
    s.background={color:"0F172A"};

    s.addText(monthLabel,{x:0.6,y:3.4,w:12,h:0.6,fontSize:19,color:"93C5FD"});
    s.addText("Generated "+new Date().toLocaleDateString(),{x:0.6,y:4,w:12,h:0.5,fontSize:11,color:"CBD5E1"});
  }

  /* Executive Summary */
  {
    const perf=computePerformanceSummary();
    const ftfRows=computeFirstTimeFixRate(r.trackedDays);
    const ftfPct = ftfRows.length? 100*ftfRows.filter(x=>x.fixed).length/ftfRows.length : null;
    const byType=oltCountsByType();
    const totalTroubleshoot=Object.values(byType).reduce((s,v)=>s+v.troubleshoot,0);
    const totalInstall=Object.values(byType).reduce((s,v)=>s+v.installation,0);
    const s=pptx.addSlide();
    addSectionTitle(s,"Executive Summary",monthLabel);
    addTable(s,["Metric","Value"],[
      ["Total Troubleshoot Tickets",totalTroubleshoot],
      ["Total Installation Tickets",totalInstall],
      ["Avg Solve Time (ASD)",perf.overallAvgHr!=null?perf.overallAvgHr.toFixed(2)+" hrs":"—"],
      ["Same-Day Resolution",perf.sameDayPct!=null?perf.sameDayPct+"%":"—"],
      ["SLA Breach (>24 hrs)",perf.slaBreach24+(totalTroubleshoot?` (${(100*perf.slaBreach24/totalTroubleshoot).toFixed(1)}%)`:"")],
      ["First-Time-Fix Rate",ftfPct!=null?ftfPct.toFixed(1)+"%":"—"]
    ],{w:7,colW:[4.5,2.5]});
  }

  /* OLT Ticket Count */
  {
    const byType=oltCountsByType();
    const rows=Object.entries(byType).sort((a,b)=>(b[1].troubleshoot+b[1].installation)-(a[1].troubleshoot+a[1].installation))
      .slice(0,18).map(([olt,v])=>[olt,v.troubleshoot,v.installation,v.troubleshoot+v.installation]);
    if(rows.length){
      const s=pptx.addSlide();
      addSectionTitle(s,"OLT Ticket Count",monthLabel);

  {
    const perf=computePerformanceSummary();
    if(perf.totalSolved){
      const s=pptx.addSlide();
      addSectionTitle(s,"ASD & SLA Performance",monthLabel);
      addTable(s,["Metric","Value"],[
        ["Total Solved",perf.totalSolved],
        ["Avg Solve Time",perf.overallAvgHr!=null?perf.overallAvgHr.toFixed(2)+" hrs":"—"],
        ["Same-Day Solved",perf.sameDaySolved+(perf.sameDayPct!=null?` (${perf.sameDayPct}%)`:"")],
        ["Breach > 24 hrs",perf.slaBreach24],
        ["Breach > 48 hrs",perf.slaBreach48]
      ],{w:7,colW:[4.5,2.5]});
    }
  }

  /* Root Cause Pareto + Controllable Action Plan */
  {
    const {diagCounts,diagTotal}=computeDiagCountsForPareto();
    if(diagTotal){
      const {rows,vitalFewCount}=computeParetoData(diagCounts);
      const s=pptx.addSlide();
      addSectionTitle(s,"Root Cause Pareto (80/20)",`${monthLabel} — ${vitalFewCount} cause${vitalFewCount===1?"":"s"} drive 80%+ of ${diagTotal} tickets`);
      addTable(s,["#","Diagnosed Cause","Tickets","% of Total","Cumulative %"],
        rows.slice(0,10).map((row,i)=>[i+1,row.label,row.value,row.pct.toFixed(1)+"%",row.cumPct.toFixed(1)+"%"]),
        {colW:[0.5,6.3,1.8,1.8,1.9]});

      const classified=rows.map(row=>({...row,cls:classifyDiagCause(row.label)}));
      const controllable=classified.filter(row=>row.cls.controllable).slice(0,5);
      if(controllable.length){
        const s2=pptx.addSlide();
        addSectionTitle(s2,"Controllable Root Causes — Suggested Fix",monthLabel);
        addTable(s2,["Cause","Tickets","Suggested Solution"],
          controllable.map(row=>[row.label,row.value,getCauseFix(row.label).solution]),
          {colW:[2.8,1.2,8.3]});
      }
    }
  }

  /* OLT Health Score */
  {
    const rows=computeOltHealthScore(r.trackedDays);
    if(rows.length){
      const s=pptx.addSlide();
      addSectionTitle(s,"OLT Health Score — Ranking",monthLabel+" (worst → best)");
      addTable(s,["Rank","OLT","Tickets","Avg ASD","Repeat %","SLA Breach %","Score"],
        rows.slice(0,16).map((x,i)=>[i+1,x.olt,x.ticketCount,x.avgHr!=null?x.avgHr.toFixed(2):"—",x.repeatPct.toFixed(1)+"%",x.breachPct.toFixed(1)+"%",x.healthScore]),
        {colW:[0.9,4,1.5,1.6,1.6,1.9,1.8]});
    }
  }

        rows.slice(0,16).map(x=>[x.fa,x.count,x.pctOfTotal.toFixed(1)+"%",(x.vsAvgPct>0?"+":"")+x.vsAvgPct.toFixed(0)+"%",x.status]),
        {colW:[4,1.8,2.2,2.2,2.1]});
    }
  }

  /* Chronic Repeat Accounts */
  {

      addSectionTitle(s,"Chronic Repeat Accounts (3+ tickets)",monthLabel+" — needs escalation");
      addTable(s,["Username","Tickets","OLT","Distinct Causes"],
        rows.slice(0,16).map(u=>[u.username,u.count,u.olt,u.distinctDiagCount]),
        {colW:[4.5,1.8,4,2]});
    }
  }

  /* VS Report */
  {
    const defs=vsReportDefs();
    const rows=defs.map(d=>{
      const matches=computeVsMatches(d.condA,d.condB,r.trackedDays,d.sameTypeDistinct);
      const users=new Set(matches.map(m=>m.user)).size;
      return [d.title,matches.length,users];
    });
    const s=pptx.addSlide();
    addSectionTitle(s,"VS Report — Repeat Pattern Summary",monthLabel+` (within ${r.trackedDays} days)`);
    addTable(s,["Pattern","Repeats","Users Involved"],rows,{colW:[8.3,2,2]});
  }

  /* Distribution Repetition */
  {
    const groups=computeDistributionRepetition(r.trackedDays);
    if(groups.length){

  /* Closing */
  {

    s.addText("Thank You",{x:0.6,y:3,w:12,h:1,fontSize:30,bold:true,color:"FFFFFF"});

  }

  const safeMonth=monthLabel.replace(/\s+/g,"_");
  await pptx.writeFile({fileName:`monthly_report_${safeMonth}_${todayStr()}.pptx`});
  } catch(err){
    console.error("PPT generation failed:",err);
    alert("Couldn't generate the PPT: "+(err&&err.message?err.message:String(err)));
  } finally {
    if(btn){ btn.disabled=false; btn.textContent=origLabel; }
  }

function computeOltMonthWise(dataset,dateField){
  const byOlt={};
  (state.datasets[dataset]||[]).forEach(r=>{
    const d=parseDateVal(r[dateField]);
    if(!d) return;
    const ni=nepInfo(ymd(d));
    if(!ni) return;
    const o=r.olt||"—";
    if(!byOlt[o]) byOlt[o]={};
    byOlt[o][ni.month]=(byOlt[o][ni.month]||0)+1;
  });
  return byOlt;
}

function hoursToHms(hrs){
  if(hrs==null||isNaN(hrs)) return "—";
  const totalSec=Math.round(hrs*3600);
  const h=Math.floor(totalSec/3600), m=Math.floor((totalSec%3600)/60), s=totalSec%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function renderReportPerformance(){
  const m=state.columnMaps.fieldvisit||{};
  const hasSolvedDate=m.solvedDate!==null&&m.solvedDate!==undefined;
  if(!hasSolvedDate){
    return `<div class="banner banner-info">To see this report, upload Field Visit data with the "Solved Time" column mapped (Upload Data → Field Visit).</div>`;
  }
  const fvAll=(state.datasets.fieldvisit||[]).filter(r=>passesNepFilter(r.solvedDate));
  const solvedRows=fvAll.filter(r=>parseDateVal(r.solvedDate));
  if(!solvedRows.length){
    return `<div class="banner banner-info">No Field Visit rows match the current filters. ${(state.reports.fYear||state.reports.fMonth)?'Try clearing the Nepali date filter above.':'Upload Field Visit data first.'}</div>`;
  }

  const totalSolved=solvedRows.length;

  const hasQuickSupport=m.quickSupport!==null&&m.quickSupport!==undefined;
  /* Quick Support is only meaningful for "No Internet Connection" tickets — that's the
     problem type it actually applies to, so both the count and the % denominator are
     scoped to just those rows, not every solved ticket. */
  const noInternetRows=solvedRows.filter(r=>normalizeDiag(r.problemType).includes("no internet"));
  const quickSupportBase=noInternetRows.length;
  const quickSupportCount=noInternetRows.filter(r=>String(r.quickSupport||"").trim().toLowerCase()==="yes").length;

  const hasOpenDate=m.openDate!==null&&m.openDate!==undefined;
  const withBothDates=hasOpenDate?solvedRows.filter(r=>parseDateVal(r.openDate)&&parseDateVal(r.solvedDate)):[];
  const durations=withBothDates.map(r=>daysBetween(parseDateVal(r.openDate),parseDateVal(r.solvedDate)));
  const sameDaySolved=durations.filter(d=>d===0).length;

  const hasSolveDurHr=m.solveDurHr!==null&&m.solveDurHr!==undefined;
  const durHrValues=hasSolveDurHr?solvedRows.map(r=>parseFloat(r.solveDurHr)).filter(n=>!isNaN(n)):[];
  const overallAvgHr=durHrValues.length?durHrValues.reduce((s,n)=>s+n,0)/durHrValues.length:null;

  const quickSupportPct=quickSupportBase?(100*quickSupportCount/quickSupportBase).toFixed(1):"0.0";
  const sameDayPctVal=durations.length?(100*sameDaySolved/durations.length).toFixed(1):"0.0";
  const topCards=`
    <div class="stat-grid">
      ${statCard("Total Solved",totalSolved)}
      ${statCard("Quick Support",hasQuickSupport?quickSupportCount:"—",hasQuickSupport?`${quickSupportPct}% of ${quickSupportBase} No Internet Connection tickets`:"Map Quick Support column",null,hasQuickSupport?"var(--primary)":null)}
      ${statCard("Same Day Solved",hasOpenDate?sameDaySolved:"—",hasOpenDate?`${sameDayPctVal}% of tickets with both dates`:"Map Issued Date column",null,hasOpenDate?"var(--good)":null)}
      ${statCard("Overall",overallAvgHr!=null?overallAvgHr.toFixed(2):"—",overallAvgHr!=null?hoursToHms(overallAvgHr):(hasSolveDurHr?"No valid values":"Map Solve Duration (Hours) column"))}
    </div>`;

  /* SLA Breach Tracking — tickets that took over 24 / 48 hours to solve, based on the
     ASD (Solve Duration Hours) column. Surfaced separately from the averages above so
     the specific slow tickets are easy to find and act on, not just averaged away. */
  const slaRows24 = hasSolveDurHr ? solvedRows.filter(r=>{const h=parseFloat(r.solveDurHr); return !isNaN(h)&&h>24;}) : [];
  const slaRows48 = hasSolveDurHr ? solvedRows.filter(r=>{const h=parseFloat(r.solveDurHr); return !isNaN(h)&&h>48;}) : [];
  const slaSection = hasSolveDurHr ? `
    <div class="table-wrap" style="margin-bottom:14px;">
      <div class="table-head">SLA Breach Tracking <span style="font-size:11px;color:var(--sub);font-weight:500;">(based on Solve Duration Hours)</span></div>
      <div style="padding:14px 16px;">
        <div class="stat-grid" style="margin-bottom:0;">
          ${statCard("Breach > 24 hrs", slaRows24.length, totalSolved?`${(100*slaRows24.length/totalSolved).toFixed(1)}% of solved tickets`:null, slaRows24.length?"var(--bad)":null)}
          ${statCard("Breach > 48 hrs", slaRows48.length, totalSolved?`${(100*slaRows48.length/totalSolved).toFixed(1)}% of solved tickets`:null, slaRows48.length?"var(--bad)":null)}
        </div>
        ${(slaRows24.length||slaRows48.length)?`<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
          ${slaRows24.length?`<button class="btn btn-ghost" style="padding:6px 14px;font-size:12px;" data-action="show-sla-breach" data-value="24">View ${slaRows24.length} tickets over 24 hrs</button>`:""}
          ${slaRows48.length?`<button class="btn btn-ghost" style="padding:6px 14px;font-size:12px;" data-action="show-sla-breach" data-value="48">View ${slaRows48.length} tickets over 48 hrs</button>`:""}
        </div>`:`<div class="hint" style="margin-top:8px;">No tickets currently breach 24 or 48 hours — nice work.</div>`}
      </div>
    </div>` : `<div class="banner banner-info" style="margin-bottom:14px;">Map the "Solve Duration (Hours)" column in Upload Data to see SLA breach tracking (tickets taking over 24 / 48 hours to solve).</div>`;
  const slaModal = state.reports.slaBreachModal ? renderSlaBreachModal(state.reports.slaBreachModal,solvedRows) : "";

  if(!hasOpenDate){
    return topCards + slaSection + `<div class="banner banner-info">Total Solved, Quick Support, and Overall (avg. solve hours) are shown above. To also see the day-by-day breakdown (Same Day / 1 Day / 2 Days...) and OLT-wise ASD, map the "Issued Date (Ticket Open)" column too.</div>` + slaModal;
  }

  const sameDayPct=durations.length?Math.round(100*sameDaySolved/durations.length):0;
  const oltAgg={};
  solvedRows.forEach(r=>{
    const o=r.olt||"—";
    if(!oltAgg[o]) oltAgg[o]={total:0,hrSum:0,hrCount:0,sameDay:0,dateCount:0};
    oltAgg[o].total++;
    const hv=parseFloat(r.solveDurHr);
    if(!isNaN(hv)){ oltAgg[o].hrSum+=hv; oltAgg[o].hrCount++; }
  });
  withBothDates.forEach((r,i)=>{
    const o=r.olt||"—";
    if(!oltAgg[o]) oltAgg[o]={total:0,hrSum:0,hrCount:0,sameDay:0,dateCount:0};

  });
  const oltRows=Object.entries(oltAgg).map(([olt,g])=>({
    olt, total:g.total,
    avgHr: g.hrCount?(g.hrSum/g.hrCount).toFixed(2):"—",
    sameDay: g.dateCount?g.sameDay:null,
    sameDayPct: g.dateCount?Math.round(100*g.sameDay/g.dateCount):0
  })).sort((a,b)=>b.total-a.total);
  const dayBuckets={"Same Day":0,"1 Day":0,"2 Days":0,"3 Days":0,"4 Days":0,"5 Days":0,"6 Days":0,"7 Days":0,"8+ Days":0};
  durations.forEach(d=>{
    const dd=Math.max(0,d);
    const k = dd===0?"Same Day": dd<=7?`${dd} Day${dd>1?'s':''}`:"8+ Days";
    dayBuckets[k]=(dayBuckets[k]||0)+1;
  });
  /* Same idea as OLT-wise ASD above, but grouped by Nepali FY month instead of OLT — so
     Same Day Support / ASD can be tracked month over month, not just by OLT. */
  const monthAgg={};
  solvedRows.forEach(r=>{
    const sd=parseDateVal(r.solvedDate);
    const ni=sd?nepInfo(ymd(sd)):null;
    const mo=ni?ni.month:"—";
    if(!monthAgg[mo]) monthAgg[mo]={total:0,hrSum:0,hrCount:0,sameDay:0,dateCount:0,qsBase:0,qsCount:0};
    monthAgg[mo].total++;
    const hv=parseFloat(r.solveDurHr);
    if(!isNaN(hv)){ monthAgg[mo].hrSum+=hv; monthAgg[mo].hrCount++; }
    if(normalizeDiag(r.problemType).includes("no internet")){
      monthAgg[mo].qsBase++;
      if(String(r.quickSupport||"").trim().toLowerCase()==="yes") monthAgg[mo].qsCount++;
    }
  });
  withBothDates.forEach((r,i)=>{
    const sd=parseDateVal(r.solvedDate);
    const ni=sd?nepInfo(ymd(sd)):null;
    const mo=ni?ni.month:"—";
    if(!monthAgg[mo]) monthAgg[mo]={total:0,hrSum:0,hrCount:0,sameDay:0,dateCount:0,qsBase:0,qsCount:0};
    monthAgg[mo].dateCount++;
    if(durations[i]===0) monthAgg[mo].sameDay++;
  });
  const monthRows=NEP_MONTH_ORDER.filter(mo=>monthAgg[mo]).map(mo=>{

      sameDayPct: g.dateCount?Math.round(100*g.sameDay/g.dateCount):0,

  const dayAgg={};

  const monthLabelForDay=[state.reports.fMonth,state.reports.fYear].filter(Boolean).join(" ");
  const dayWiseSection = !state.reports.fMonth

    : (!dayRows.length ? "" : `

    <div class="card" style="margin-top:14px;"><div class="card-title" style="font-weight:700;font-size:13px;margin-bottom:12px;">Avg Solve Hours (ASD) by Date</div>${sparklineChart(dayRows.map(d=>({label:String(d.day),value:d.avgHr!=null?Math.round(d.avgHr*100)/100:0,suffix:" hrs"})),{color:"#7C3AED"})}</div>
    <div class="card" style="margin-top:14px;"><div class="card-title" style="font-weight:700;font-size:13px;margin-bottom:12px;">Same Day Solved % by Date</div>${sparklineChart(dayRows.map(d=>({label:String(d.day),value:d.sameDayPct,suffix:"%"})),{color:"#16A34A"})}</div>
    ${hasQuickSupport?`<div class="card" style="margin-top:14px;"><div class="card-title" style="font-weight:700;font-size:13px;margin-bottom:12px;">Quick Support % by Date <span style="font-size:11px;color:var(--sub);font-weight:500;">(of No Internet Connection tickets)</span></div>${sparklineChart(dayRows.map(d=>({label:String(d.day),value:d.qsPct,suffix:"%"})),{color:"#D97706"})}</div>`:""}

const OPEN_HOUR_BUCKETS=["1 - 3","4 - 6","7 - 9","10 - 12","13 - 15","16 - 18","19 - 21","22 - 24"];
function openHourBucket(h){
  if(h>=1&&h<=3) return OPEN_HOUR_BUCKETS[0];
  if(h>=4&&h<=6) return OPEN_HOUR_BUCKETS[1];
  if(h>=7&&h<=9) return OPEN_HOUR_BUCKETS[2];
  if(h>=10&&h<=12) return OPEN_HOUR_BUCKETS[3];
  if(h>=13&&h<=15) return OPEN_HOUR_BUCKETS[4];
  if(h>=16&&h<=18) return OPEN_HOUR_BUCKETS[5];
  if(h>=19&&h<=21) return OPEN_HOUR_BUCKETS[6];
  return OPEN_HOUR_BUCKETS[7];
}
const MONTH_ABBR=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtShortDate(g){
  const d=parseDateVal(g);
  if(!d) return g;
  return `${String(d.getDate()).padStart(2,"0")}-${MONTH_ABBR[d.getMonth()]}-${d.getFullYear()}`;
}
function computeOpenTimeFrameData(){
  const r=state.reports;
  if(!r.fYear||!r.fMonth) return null;
  const dates=Object.entries(NEP_DATE_MAP)
    .filter(([g,info])=>String(info.year)===String(r.fYear)&&info.month===r.fMonth)
    .map(([g])=>g)
    .sort();
  if(!dates.length) return {dates:[],byDate:{}};
  const byDate={};
  dates.forEach(g=>{
    byDate[g]={hourCounts:{},grandTotal:0,solvedCount:0,sameDayCount:0,hrSum:0,hrCount:0};
    OPEN_HOUR_BUCKETS.forEach(b=>byDate[g].hourCounts[b]=0);
  });
  (state.datasets.fieldvisit||[]).forEach(rec=>{
    const od=parseDateVal(rec.openDate);
    if(od){
      const g=ymd(od);
      if(byDate[g]){
        byDate[g].hourCounts[openHourBucket(od.getHours())]++;
        byDate[g].grandTotal++;
      }
    }
    const sd=parseDateVal(rec.solvedDate);
    if(sd){
      const g=ymd(sd);
      if(byDate[g]){
        byDate[g].solvedCount++;
        const hv=parseFloat(rec.solveDurHr);
        if(!isNaN(hv)){ byDate[g].hrSum+=hv; byDate[g].hrCount++; }
        if(od&&ymd(od)===g) byDate[g].sameDayCount++;
      }
    }
  });
  return {dates,byDate};
}
function computeOpenTimeMonthWiseData(){
  const byMonth={};
  NEP_MONTH_ORDER.forEach(m=>{ byMonth[m]={hourCounts:{},total:0}; OPEN_HOUR_BUCKETS.forEach(b=>byMonth[m].hourCounts[b]=0); });
  (state.datasets.fieldvisit||[]).forEach(rec=>{
    const od=parseDateVal(rec.openDate);
    if(!od) return;
    const ni=nepInfo(ymd(od));
    if(!ni||!byMonth[ni.month]) return;
    const b=openHourBucket(od.getHours());
    byMonth[ni.month].hourCounts[b]++;
    byMonth[ni.month].total++;
  });
  return byMonth;
}

/* ===== Root Cause Pareto (80/20) ===== */
/* ===== Controllable Root Causes — solution + 5 Whys per Diagnosed cause =====
   Best-effort keyword classification (the Diagnosed labels are free-text/company-specific,
   so this can't be perfect) — causes matching an "outside our control" pattern (power
   cuts, customer-owned devices, weather, third-party damage, upstream/backbone, billing,
   no-fault-found) are excluded from the action list; everything else is treated as within
   the field team's control and gets a solution + a 5-Whys ladder. Both automatically
   recompute against whatever the Nepali date filter above is currently set to. */
function classifyDiagCause(label){
  const s=(label||"").toLowerCase();
  const notControl=[
    {test:/power\s*cut|load\s*shed|\bnea\b|electricity fail/, note:"National power outage / load-shedding — outside the ISP's direct control. Mitigate with backup battery/UPS at the customer end."},
    {test:/customer.*(router|device|laptop|pc|mobile|tv)|own router|customer.?owned/, note:"Customer-owned device issue — not ISP hardware. Educate the customer or offer a paid device check/replacement."},

function computeParetoData(counts){
  const total=Object.values(counts).reduce((s,v)=>s+v,0);
  const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  let cum=0;
  const rows=sorted.map(([label,value])=>{
    cum+=value;
    return {label,value,pct: total?100*value/total:0, cumPct: total?100*cum/total:0};
  });
  let vitalFewCount=rows.findIndex(r=>r.cumPct>=80)+1;
  if(vitalFewCount<=0) vitalFewCount=rows.length;
  return {rows,total,vitalFewCount};
}
function renderParetoSection(diagCounts,diagTotal){
  if(!diagTotal) return "";

  const vitalTickets=rows.slice(0,vitalFewCount).reduce((s,r)=>s+r.value,0);
  const vitalPct=diagTotal?Math.round(100*vitalTickets/diagTotal):0;

/* =========================================================
   Ticket Projection — month-over-month trend, with an in-progress
   month's actual-so-far count scaled up to a full-month projection
   (actual / daysElapsed * totalDaysInMonth), broken down by Problem
   Type (expandable into Diagnosed). This is deliberately independent
   of the global Nepali Year/Month filter above (like the other
   "whole FY" month-wise views) since it always needs exactly two
   specific, adjacent months to compare.
   ========================================================= */
function projectionDateField(){
  const m=state.columnMaps.fieldvisit||{};
  return (m.openDate!==null&&m.openDate!==undefined) ? "openDate" : "solvedDate";
}
function nepMonthYearOf(monthName){
  const rec=Object.values(NEP_DATE_MAP).find(v=>v.month===monthName);
  return rec?rec.year:null;
}
function totalDaysInNepMonth(monthName,year){
  return Object.values(NEP_DATE_MAP).filter(v=>v.month===monthName&&v.year===year).length;
}
function computeMonthsWithData(dateField){
  const present=new Set();
  (state.datasets.fieldvisit||[]).forEach(r=>{
    const d=parseDateVal(r[dateField]);
    if(!d) return;
    const ni=nepInfo(ymd(d));
    if(ni) present.add(ni.month);
  });
  return NEP_MONTH_ORDER.filter(m=>present.has(m));
}
function computeProjectionData(currentMonth,dateField,groupBy){
  groupBy = groupBy || "problem";
  const idx=NEP_MONTH_ORDER.indexOf(currentMonth);
  if(idx<=0) return null; /* first month in the loaded calendar has no prior month to compare against */
  const prevMonth=NEP_MONTH_ORDER[idx-1];
  const currYear=nepMonthYearOf(currentMonth), prevYear=nepMonthYearOf(prevMonth);
  if(currYear==null||prevYear==null) return null;
  const totalDaysCurr=totalDaysInNepMonth(currentMonth,currYear);

  const currRows=[],prevRows=[];
  let asOfDay=0;
  const fallbackField = dateField==="openDate" ? "solvedDate" : "openDate";
  (state.datasets.fieldvisit||[]).forEach(r=>{
    /* Prefer dateField, but fall back to the other date if it's missing — otherwise a
       still-pending ticket (no Solved Date yet) silently drops out of "this month" just
       because it hasn't been closed, undercounting the month's real ticket volume. */
    const d=parseDateVal(r[dateField])||parseDateVal(r[fallbackField]);
    if(!d) return;
    const ni=nepInfo(ymd(d));
    if(!ni) return;
    if(ni.month===currentMonth&&ni.year===currYear){
      currRows.push(r);
      const day=parseInt((ni.nep.split("/")[2]||"0"),10);
      if(day>asOfDay) asOfDay=day;
    } else if(ni.month===prevMonth&&ni.year===prevYear){
      prevRows.push(r);
    }
  });
  const ratio = asOfDay>0 ? (totalDaysCurr/asOfDay) : 0;

  /* groupBy "problem": top level = Problem Type, drilldown = Diagnosed.
     groupBy "fa": top level = FA (solvedBy), drilldown = Problem Type — surfaces whose
     workload is rising, not just which issue category. */
  const topKeyOf = groupBy==="olt" ? (r=>r.olt?r.olt:"(unassigned)") : (r=>r.problemType?normalizeDiag(r.problemType):"(blank)");
  const subKeyOf = groupBy==="olt" ? (r=>r.problemType?normalizeDiag(r.problemType):"(blank)") : (r=>r.diagnosed?normalizeDiag(r.diagnosed):"(blank)");
  function tally(rows){
    const byTop={};
    rows.forEach(r=>{
      const p=topKeyOf(r);
      if(!byTop[p]) byTop[p]={count:0,sub:{}};
      byTop[p].count++;
      const s=subKeyOf(r);
      byTop[p].sub[s]=(byTop[p].sub[s]||0)+1;
    });
    return byTop;
  }
  const prevByTop=tally(prevRows), currByTop=tally(currRows);

  function pct(prev,projected){
    if(prev===0) return projected>0 ? null : 0; /* null = "New" (no baseline last month) */
    return ((projected-prev)/prev)*100;
  }
  const allTop=new Set([...Object.keys(prevByTop),...Object.keys(currByTop)]);
  const rowsOut=Array.from(allTop).map(p=>{
    const prevCount=prevByTop[p]?prevByTop[p].count:0;
    const currCount=currByTop[p]?currByTop[p].count:0;
    const projected=currCount*ratio;
    const allSub=new Set([...(prevByTop[p]?Object.keys(prevByTop[p].sub):[]),...(currByTop[p]?Object.keys(currByTop[p].sub):[])]);
    const diagRows=Array.from(allSub).map(dg=>{
      const dPrev=prevByTop[p]?(prevByTop[p].sub[dg]||0):0;
      const dCurr=currByTop[p]?(currByTop[p].sub[dg]||0):0;
      const dProjected=dCurr*ratio;
      return {label:dg,prevCount:dPrev,currCount:dCurr,projected:dProjected,changePct:pct(dPrev,dProjected)};
    }).sort((a,b)=>b.projected-a.projected);
    return {label:p,prevCount,currCount,projected,changePct:pct(prevCount,projected),diagRows};
  }).sort((a,b)=>b.projected-a.projected);

  const prevGrand=prevRows.length, currGrand=currRows.length, projectedGrand=currGrand*ratio;
  return {prevMonth,currentMonth,prevYear,currYear,totalDaysCurr,asOfDay,ratio,rows:rowsOut,
    prevGrand,currGrand,projectedGrand,changePctGrand:pct(prevGrand,projectedGrand)};
}
function projChangeColor(changePct,diff){
  if(changePct==null) return "var(--warn)"; /* New */
  if(changePct<0) return "var(--good)";
  if(changePct<15) return "var(--warn)";
  /* % says "rising 15%+", but off a small base that can swing wildly (e.g. 3 → 8 = +138.5%
     yet only +5 tickets) — don't flag red purely on % when the actual headcount barely moved. */
  if(diff!=null && diff<6) return "var(--warn)";
  return "var(--bad)";

function projChangeLabel(changePct,prevCount,projected){
  const projRounded = projected!=null ? Math.ceil(projected) : null;
  if(changePct==null){
    return projRounded!=null ? `New (+${projRounded})` : "New";
  }
  const sign=changePct>0?"+":"";
  let diffLabel="";
  if(prevCount!=null && projRounded!=null){
    const diff=projRounded-prevCount;
    diffLabel = ` (${diff>0?'+':''}${diff})`;
  }
  return `${sign}${changePct.toFixed(1)}%${diffLabel}`;
}

    <div class="banner banner-info" style="margin-top:0;">

      Projected full-month total: <strong style="color:${grandColor};">${Math.ceil(data.projectedGrand)}</strong>

      ${data.asOfDay===0?' No tickets recorded yet this month — projection unavailable until at least one comes in.':''}
    </div>

/* ---------------- event handling ---------------- */
document.addEventListener("input",e=>{
  const t=e.target, mode=t.dataset.mode;
  if(mode==="text"){
    const field=t.dataset.field;
    if(field==="manageVal"){ state.manageVal=t.value; return; }
    if(field==="manageEditVal"){ state.manageEditVal=t.value; return; }
    if(field==="customerId"){
      const cleaned=t.value.replace(/[^0-9]/g,"");
      if(cleaned!==t.value){ t.value=cleaned; }
      state.entry.form.customerId=cleaned;
      return;
    }
    state.entry.form[field]=t.value;
  } else if(mode==="dash-text"){
    state.dashboard[t.dataset.field]=t.value;
    clearTimeout(window.__searchTimer);
    window.__searchTimer=setTimeout(render,250);
  } else if(mode==="pending-text"){
    state.pending.q=t.value;
    clearTimeout(window.__pendingTimer);
    window.__pendingTimer=setTimeout(render,250);
  } else if(mode==="note-text"){
    state.note.draftText=t.value;
  } else if(mode==="teamcalc-field"){
    state.teamCalc[t.dataset.field]=t.value;
    updateTeamCalcOutputs();
  } else if(mode==="fvr-field"){
    state.fvrCalc[t.dataset.field]=t.value;
    updateTeamCalcOutputs();
  } else if(mode==="cascade-field"){
    state.reports[t.dataset.field]=t.value;
    render();
  } else if(mode==="sp-top-field"){
    state.shiftPlanner[t.dataset.field]=t.value;
    render();
  } else if(mode==="sp-shift-field"){
    const sh=state.shiftPlanner.shifts.find(s=>s.id===t.dataset.shift);
    if(sh) sh[t.dataset.field]=t.value;
    render();
  } else if(mode==="sp-period-field"){
    const p=state.shiftPlanner.periods.find(x=>x.id===t.dataset.id);
    if(p) p[t.dataset.field]=t.value;
    render();
  } else if(mode==="sp-scenario-field"){
    const sc=state.shiftPlanner.scenarios.find(x=>x.id===t.dataset.id);
    if(sc) sc[t.dataset.shift]=t.value;
    render();
  } else if(mode==="sp-weekday-mult"){
    state.shiftPlanner.weekdayMultipliers[t.dataset.weekday]=t.value;
    render();
  } else if(mode==="sp-taskmix-toggle"){
    state.shiftPlanner.useTaskMix=t.checked;
    render();
  } else if(mode==="sp-taskmix-field"){
    state.shiftPlanner.taskMix[t.dataset.field]=t.value;
    render();
  } else if(mode==="ticket-history-search"){
    state.reports.ticketHistorySearch=t.value;
    render();
  }
});

document.addEventListener("change",e=>{
  const t=e.target, mode=t.dataset.mode;
  if(t.id==="powerYesterdayInput"){ handlePowerCompareFile(t,"yesterday"); return; }
  if(t.id==="powerTodayInput"){ handlePowerCompareFile(t,"today"); return; }
    if(t.id==="uploadFileInput"){ handleUploadFile(t); return; }
  if(mode==="select"){
    state.entry.form[t.dataset.field]=t.value;
    delete state.entry.errors[t.dataset.field];
    render();
  } else if(mode==="dash-select"){
    state.dashboard[t.dataset.field]=t.value;
    render();
  } else if(mode==="pending-select"){
    state.pending[t.dataset.field]=t.value;
    render();
  } else if(mode==="pending-date"){
    state.pending[t.dataset.field]=t.value;
    render();
  } else if(mode==="upload-header-row"){
    let idx=parseInt(t.value,10)-1;
    if(isNaN(idx)) idx=0;
    idx=Math.max(0,Math.min(state.upload.rawRows.length-1,idx));
    state.upload.headerRowIdx=idx;
    const headerRow=state.upload.rawRows[idx]||[];
    state.upload.mapping=guessColumnMap(headerRow,FIELD_TARGETS[state.upload.type]);
    render();
  } else if(mode==="upload-map"){
    const key=t.dataset.field;
    state.upload.mapping[key]=t.value===""?null:parseInt(t.value,10);
    render();
  } else if(mode==="reports-tracked-days"){
    let v=parseInt(t.value,10);
    if(isNaN(v)||v<1) v=1;
    state.reports.trackedDays=v;
    render();
  } else if(mode==="reports-nep-select"){
    state.reports[t.dataset.field]=t.value;
    render();
  } else if(mode==="proj-select"){
    state.reports.projMonth=t.value;
    render();
  } else if(mode==="note-action"){
    const id=t.dataset.id, val=t.value;
    if(val==="__delete__") deleteNoteEntry(id);
    else updateNoteEntryStatus(id,val);
  } else if(mode==="datefinder-eng"){
    state.dateFinder.engDate=t.value;
    render();
  } else if(mode==="datefinder-nep-select"){
    state.dateFinder[t.dataset.field]=t.value;
    render();
  }
});

document.addEventListener("click",e=>{
  const btn=e.target.closest("[data-action]");
  if(e.target.closest("[data-stop]") && !btn) return;
  if(!btn) return;
  const action=btn.dataset.action;

  if(action==="nav"){
    state.page=btn.dataset.value;
    if(state.page==="dashboard") loadAudits();
    else if(state.page==="duty"){ render(); initDutyRosterAll(); }
    else if(state.page==="note"){ render(); loadNoteIfNeeded().then(render); }
    else render();
  }
  else if(action==="power-below26"){ state.powerCompare.filter="below26"; render(); }
  else if(action==="power-all-today"){ state.powerCompare.filter="all"; render(); }
  else if(action==="power-compare"){ state.powerCompare.filter="all"; render(); }
  else if(action==="toggle-nav"){ state.navCollapsed=!state.navCollapsed; render(); }
  else if(action==="cascade-clear-dates"){ state.reports.cascadeFromDate=""; state.reports.cascadeToDate=""; render(); }
  else if(action==="sp-task-preset"){ state.shiftPlanner.avgTaskTimeMinutes=btn.dataset.value; render(); }
  else if(action==="sp-add-period"){
    const sp=state.shiftPlanner;
    const lastEnd = sp.periods.length ? sp.periods[sp.periods.length-1].end : "07:00";
    sp.periods.push({id:"p"+(sp.periodSeq++), start:lastEnd, end:lastEnd, pct:0});
    render();
  }
  else if(action==="sp-remove-period"){
    const sp=state.shiftPlanner;
    sp.periods=sp.periods.filter(p=>p.id!==btn.dataset.value);
    render();
  }
  else if(action==="sp-scenario-add"){
    const sp=state.shiftPlanner;
    const live=sp.shifts;
    const get=(id)=>{ const s=live.find(x=>x.id===id); return s?parseFloat(s.teams)||0:0; };
    sp.scenarios.push({id:"s"+(sp.scenarioSeq++), label:"Scenario "+sp.scenarioSeq, teamsA:get("A"), teamsB:get("B"), teamsC:get("C")});
    render();
  }
  else if(action==="sp-scenario-remove"){
    const sp=state.shiftPlanner;
    sp.scenarios=sp.scenarios.filter(s=>s.id!==btn.dataset.value);
    render();
  }
  else if(action==="sp-scenario-apply"){
    const sp=state.shiftPlanner;
    const sc=sp.scenarios.find(s=>s.id===btn.dataset.value);
    if(sc){
      sp.shifts.forEach(s=>{
        const key=s.id==="A"?"teamsA":s.id==="B"?"teamsB":"teamsC";
        if(sc[key]!=null) s.teams=sc[key];
      });
    }
    render();
  }
  else if(action==="assignsolve-mode"){ state.reports.assignSolveMode=btn.dataset.value; render(); }
  else if(action==="toggle-assignsolve-top"){ const k=btn.dataset.value; state.reports.assignSolveExpandedTop[k]=!state.reports.assignSolveExpandedTop[k]; render(); }
  else if(action==="toggle-assignsolve-fa"){ const k=btn.dataset.value; state.reports.assignSolveExpandedFa[k]=!state.reports.assignSolveExpandedFa[k]; render(); }
  else if(action==="th-pick-user"){ state.reports.ticketHistorySearch=btn.dataset.value; render(); }
  else if(action==="sp-view-mode"){ state.shiftPlanner.viewMode=btn.dataset.value; render(); }
  else if(action==="sp-fill-real-data"){
    const real=computeRealDataForShiftPlanner();
    if(!real.withHour){
      alert("No Field Visit tickets with a usable Issued Date found — can't fill from real data yet. Map \"Issued Date\" on your Field Visit upload first.");
    } else {
      const sp=state.shiftPlanner;
      sp.avgTicketsPerDay=Math.round(real.avgTicketsPerDay*10)/10;
      const sums=sp.periods.map(p=>spPeriodHourlySum(p,real.hourlyAvg));
      const totalSum=sums.reduce((a,b)=>a+b,0)||1;
      sp.periods.forEach((p,i)=>{ p.pct=Math.round((sums[i]/totalSum)*1000)/10; });
      const sumPct=sp.periods.reduce((s,p)=>s+p.pct,0);
      if(sp.periods.length) sp.periods[sp.periods.length-1].pct=Math.round((sp.periods[sp.periods.length-1].pct+(100-sumPct))*10)/10;
      render();
    }
  }
  else if(action==="sp-snapshot"){
    if(typeof html2canvas==="undefined"){ alert("The snapshot library couldn't load — check your internet connection and try again."); }
    else {
      const el=document.getElementById("sp-summary-card");
      if(!el){ alert("Couldn't find the summary card to capture."); }
      else {
        const origLabel=btn.textContent;
        btn.disabled=true; btn.textContent="⏳ Capturing…";
        html2canvas(el,{backgroundColor:"#ffffff",scale:2}).then(canvas=>{
          const link=document.createElement("a");
          link.download="duty_roster_"+todayStr()+".png";
          link.href=canvas.toDataURL("image/png");
          link.click();
        }).catch(err=>{
          console.error("Snapshot failed:",err);
          alert("Couldn't create the snapshot: "+(err&&err.message?err.message:String(err)));
        }).finally(()=>{ btn.disabled=false; btn.textContent=origLabel; });
      }
    }
  }
  else if(action==="cascade-view-detail"){ state.reports.cascadeDetailKey=btn.dataset.value; render(); }
  else if(action==="close-cascade-detail"){ state.reports.cascadeDetailKey=null; render(); }
  else if(action==="close-cascade-detail-overlay"){ if(e.target===btn){ state.reports.cascadeDetailKey=null; render(); } }
  else if(action==="nav-pending"){ state.page="pending"; if(btn.dataset.value) state.pending.source=btn.dataset.value; render(); }
  else if(action==="nav-reports-tab"){ state.page="reports"; if(btn.dataset.value) state.reports.tab=btn.dataset.value; render(); }
  else if(action==="open-manage"){ state.showManage=true; render(); }
  else if(action==="close-manage"){ state.showManage=false; render(); }
  else if(action==="close-manage-overlay"){ if(e.target===btn){ state.showManage=false; render(); } }
  else if(action==="manage-tab"){ state.manageTab=btn.dataset.value; state.manageVal=""; state.manageEditKey=null; render(); }
  else if(action==="manage-add"){
    const tab=state.manageTab, val=(state.manageVal||"").trim();
    if(val){
      state.lists[tab]=[...state.lists[tab],val];
      state.manageVal="";
      const keyMap={olts:"config:olts",auditors:"config:auditors",fas:"config:fas"};
      sSet(keyMap[tab],JSON.stringify(state.lists[tab]),true);
      render();
    }
  }
  else if(action==="manage-remove"){
    const tab=state.manageTab, val=btn.dataset.value;
    state.lists[tab]=state.lists[tab].filter(x=>x!==val);
    const keyMap={olts:"config:olts",auditors:"config:auditors",fas:"config:fas"};
    sSet(keyMap[tab],JSON.stringify(state.lists[tab]),true);
    render();
  }
  else if(action==="manage-edit-start"){
    state.manageEditKey=btn.dataset.value;
    state.manageEditTab=btn.dataset.tab;
    state.manageEditVal=btn.dataset.value;
    render();
  }
  else if(action==="manage-edit-cancel"){ state.manageEditKey=null; render(); }
  else if(action==="manage-edit-save"){
    renameListItem(state.manageEditTab, btn.dataset.value, state.manageEditVal);
  }
  else if(action==="select-type"){ state.entry.auditType=btn.dataset.value; state.entry.step=2; render(); }
  else if(action==="select-method"){ state.entry.auditMethod=btn.dataset.value; state.entry.step=3; render(); }
  else if(action==="back-step"){ state.entry.step=parseInt(btn.dataset.value,10); render(); }

function validateEntry(){
  const e=state.entry, f=e.form;
  const req={customerName:f.customerName,customerId:f.customerId,date:f.date,olt:f.olt,adutor:f.adutor,installedBy:f.installedBy};
  const errs={};
  Object.entries(req).forEach(([k,v])=>{ if(!v) errs[k]="Required"; });
  if(f.customerId && !errs.customerId){
    if(!/^[0-9]+$/.test(f.customerId)){
      errs.customerId="Only numbers allowed";
    }
  }
  const plErr=validatePowerLevel(f.powerLevel);
  if(plErr) errs.powerLevel=plErr;

  if(e.auditType==="Installation"){
    ["housePic","tos","tosPage2","tosPage7","citizenship"].forEach(k=>{ if(!f[k]) errs[k]="Required"; });
  } else {
    ["distributionSplitterClosed","clientEndTClamp","clientEndEntryPoint","distributionSplitterTClamp","routerPositionFloorMap"].forEach(k=>{ if(!f[k]) errs[k]="Required"; });
  }
  if(e.auditMethod==="Customer Follow Up"){
    if(!f.followUpRemarks) errs.followUpRemarks="Required";
    else if(f.followUpRemarks==="Follow Up Done"){
      ["internetPerformance","mobileApp","csatEducated"].forEach(k=>{ if(!f[k]) errs[k]="Required"; });
      if(e.auditType==="Installation"&&!f.indoorFinishing) errs.indoorFinishing="Required";
      if(f.csatEducated==="No"&&!f.csatLinkEducated) errs.csatLinkEducated="Required";
      if(f.csatEducated==="No"&&f.csatLinkEducated==="No"&&!f.csatWhy) errs.csatWhy="Required";
    }
  }
  return errs;
}
async function submitEntry(){
  const errs=validateEntry();
  state.entry.errors=errs;
  if(Object.keys(errs).length){ render(); return; }
  state.entry.saving=true; render();
  const e=state.entry;
  const record=Object.assign({id:newId(),auditType:e.auditType,auditMethod:e.auditMethod,createdAt:new Date().toISOString()},e.form);

  const priorAudits=state.dashboard.audits.filter(a=>String(a.customerId)===String(record.customerId));
  for(const old of priorAudits){
    await sSet("audit_archive:"+old.id,JSON.stringify(old),true).catch(()=>{});
    await sDelete("audit:"+old.id,true).catch(()=>{});
  }
  state.dashboard.audits=state.dashboard.audits.filter(a=>String(a.customerId)!==String(record.customerId));
  state.dashboard.audits.unshift(record);
  state.entry.saved=true;
  sSet("audit:"+record.id,JSON.stringify(record),true).catch(()=>{});
  state.entry.saving=false;
  render();
}

     interaction elsewhere in the app. */
  setInterval(()=>{

  ]);
  state.lists={olts,auditors,fas};

  render();
})();

/* ---------- storage helpers ---------- */
async function loadKey(key, fallback){
  try{
    const dv=await __dbGet(key,false);
    if(dv!==undefined) return dv!==null?JSON.parse(dv):fallback;
    const av=await __apiGet(key,true);
    if(av!==undefined) return av!==null?JSON.parse(av):fallback;
    if(HAS_STORAGE){ const res = await window.storage.get(key, false); if(res && res.value) return JSON.parse(res.value); return fallback; }
    if(localStoreOK){ const v=localStorage.getItem(LS_PREFIX+key); return v!==null?JSON.parse(v):fallback; }
    return fallback;
  }catch(err){
    return fallback;
  }
}
async function saveKey(key, obj){
  try{
    if(await __dbSet(key, JSON.stringify(obj), false)) return true;
    if(await __apiSet(key, JSON.stringify(obj), true)) return true;
    if(HAS_STORAGE){ const res = await window.storage.set(key, JSON.stringify(obj), false); return !!res; }
    if(localStoreOK){ localStorage.setItem(LS_PREFIX+key, JSON.stringify(obj)); return true; }
    return false;
  }catch(err){
    console.error('storage save failed', err);
    return false;
  }
}

const DAYROSTER_PREFIX = 'dayroster:v2:';
const MONTHDUTY_PREFIX = 'monthduty:v2:';
const HOLIDAYOT_PREFIX = 'holidayot:v2:';

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

let cachedDayRoster = null;
let cachedMonthDuty = null;
let cachedOtRoster = null;

async function loadConsolidated(prefix, fallbackPerMonth){
  const allKey = prefix + 'all';
  const existing = await loadKey(allKey, null);
  if(existing){
    MONTHS.forEach(m => { if(!(m in existing)) existing[m] = JSON.parse(JSON.stringify(fallbackPerMonth)); });
    return existing;
  }
  const merged = {};
  for(const m of MONTHS){
    merged[m] = await loadKey(prefix + m, fallbackPerMonth);
    await sleep(120);
  }
  await saveKey(allKey, merged);
  return merged;
}

async function loadAllDutyData(){
  cachedDayRoster = await loadConsolidated(DAYROSTER_PREFIX, {});
  cachedMonthDuty = await loadConsolidated(MONTHDUTY_PREFIX, []);
  cachedOtRoster = await loadConsolidated(HOLIDAYOT_PREFIX, {});
}

function computeDashboardStats(allDayData, allMonthDutyData, allOtData){
  const workload = {};
  function bump(id, field){
    if(!id) return;
    if(!workload[id]) workload[id] = { senior:0, junior:0, ot:0, total:0 };
    workload[id][field]++;
    workload[id].total++;
  }
  let totalDayAssignments = 0, totalOtAssignments = 0, totalMonthDutyAssignments = 0;

  MONTHS.forEach(m => {
    const dayData = allDayData[m] || {};
    Object.values(dayData).forEach(rows => {
      (rows||[]).forEach(row => {
        if(row.seniorId){ bump(row.seniorId,'senior'); totalDayAssignments++; }
        if(row.juniorId){ bump(row.juniorId,'junior'); }
      });
    });
    const mdRows = allMonthDutyData[m] || [];
    mdRows.forEach(row => {
      if(row.seniorId){ bump(row.seniorId,'senior'); totalMonthDutyAssignments++; }
      if(row.juniorId){ bump(row.juniorId,'junior'); }
    });
    const otData = allOtData[m] || {};
    Object.values(otData).forEach(rows => {
      (rows||[]).forEach(row => {
        if(row.seniorId){ bump(row.seniorId,'ot'); totalOtAssignments++; }
        if(row.juniorId){ bump(row.juniorId,'ot'); }
      });
    });
  });

  let workingDaysTotal = 0, workingDaysCovered = 0;
  let holidaysTotal = 0, holidaysCoveredOt = 0;
  CALENDAR.forEach(d => {
    if(d.dayType === 'Working Day'){
      workingDaysTotal++;
      const rows = (allDayData[d.month]||{})[d.eng] || [];
      if(rows.length) workingDaysCovered++;
    } else {
      holidaysTotal++;
      const rows = (allOtData[d.month]||{})[d.eng] || [];
      if(rows.length) holidaysCoveredOt++;
    }
  });

  const monthActivity = MONTHS.map(m => {
    const dayData = allDayData[m] || {};
    let dayCount = 0;
    Object.values(dayData).forEach(rows => dayCount += (rows||[]).length);
    const otData = allOtData[m] || {};
    let otCount = 0;
    Object.values(otData).forEach(rows => otCount += (rows||[]).length);
    const mdCount = (allMonthDutyData[m] || []).length;
    return { month:m, dayCount, otCount, mdCount, total: dayCount+otCount+mdCount };
  });

  return { workload, totalDayAssignments, totalOtAssignments, totalMonthDutyAssignments,
    workingDaysTotal, workingDaysCovered, holidaysTotal, holidaysCoveredOt, monthActivity };
}

    const line1 = juniorName
      ? `${seniorName}<span class="dr-arrow">→</span>${juniorName}`
      : `${seniorName} <span class="dr-arrow">(Solo)</span>`;
    const line2Parts = [];
    if(row.app) line2Parts.push(`App: ${row.app}`);
    if(row.taskType) line2Parts.push(row.taskType);
    if(row.field) line2Parts.push(row.field);
    if(row.shift) line2Parts.push(row.shift);

    return `
      <div class="dr-pair-chip">
        <div class="dr-pc-line1">${line1}</div>
        ${line2Parts.length ? `<div class="dr-pc-line2">${line2Parts.join(' · ')}</div>` : ''}

  }).join('');
  return `<div class="dr-pairs-wrap">${chips}</div>`;

async function initTeamTab(){
  renderTeamList();
  document.getElementById('team-add-btn').addEventListener('click', async () => {
    const nameInput = document.getElementById('team-new-name');
    const idInput = document.getElementById('team-new-id');
    const errBox = document.getElementById('team-add-error');
    const name = nameInput.value.trim();
    const exchangeId = idInput.value.trim();
    errBox.style.display = 'none';
    if(!name || !exchangeId){
      errBox.textContent = 'Please enter both Name and Exchange ID.';
      errBox.style.display = 'block';
      return;
    }
    if(TEAM.some(e => e.exchangeId.toLowerCase() === exchangeId.toLowerCase())){
      errBox.textContent = 'This Exchange ID already exists in the team.';
      errBox.style.display = 'block';
      return;
    }
    TEAM.push({ ein: null, exchangeId, name });
    rebuildEmpIndex();
    const ok = await saveTeam();
    if(!ok){ errBox.textContent = 'Could not save. Please try again.'; errBox.style.display = 'block'; return; }
    nameInput.value = ''; idInput.value = '';
    renderTeamList();
    refreshAllTabsForTeamChange();
  });
  document.getElementById('team-list-body').addEventListener('click', async (e) => {
    const tr = e.target.closest('tr');
    if(!tr) return;
    const id = tr.dataset.id;
    if(e.target.classList.contains('dr-team-remove')){
      teamRemoveConfirmId = id;
      renderTeamList();
      return;
    }
    if(e.target.classList.contains('dr-team-remove-cancel')){
      teamRemoveConfirmId = null;
      renderTeamList();
      return;
    }
    if(e.target.classList.contains('dr-team-remove-confirm')){
      TEAM = TEAM.filter(x => x.exchangeId !== id);
      teamRemoveConfirmId = null;
      rebuildEmpIndex();
      const ok = await saveTeam();
      if(!ok){ alert('Could not save. Please try again.'); return; }
      renderTeamList();
      refreshAllTabsForTeamChange();
    }
  });
}
