<style>
  :root{
    --primary:#1D4ED8; --primary-dark:#0F1F4B; --ink:#0F172A; --sub:#64748B;
    --border:#E2E8F0; --bg:#F5F7FB; --card:#FFFFFF; --good:#16A34A; --bad:#DC2626;
    --warn:#D97706; --accent:#0891B2;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);}
  select,input,textarea,button{font-family:inherit;}
  .header{background:linear-gradient(135deg,var(--primary-dark),#16255C);color:#fff;padding:0 20px;position:sticky;top:0;z-index:100;box-shadow:0 2px 10px rgba(15,23,42,.25);}
  .header-inner{max-width:1220px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:8px 0 6px;flex-wrap:wrap;gap:6px;}
  .brand{display:flex;align-items:center;gap:8px;padding:2px 0;}
  .brand-icon{width:26px;height:26px;border-radius:7px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
  .brand-title{font-weight:800;font-size:13px;letter-spacing:.2px;line-height:1.2;}
  .brand-sub{font-size:9.5px;color:#94A3B8;line-height:1.2;}
  .nav{display:flex;gap:4px;flex-wrap:wrap;}
  .nav-btn{display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:7px;background:transparent;color:#CBD5E1;border:none;cursor:pointer;font-size:11.5px;font-weight:700;}
  .nav-btn.active{background:#fff;color:var(--primary-dark);}
  .container{max-width:1220px;margin:0 auto;padding:22px 20px;}
  .banner{max-width:1220px;margin:12px auto 0;padding:10px 16px;background:#FEF3C7;border:1px solid #FDE68A;color:#92400E;border-radius:10px;font-size:12.5px;}
  .banner-info{background:#DBEAFE;border-color:#BFDBFE;color:#1E3A8A;}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px;}
  .req{color:var(--bad);}
  .hint{font-size:12px;color:var(--sub);margin-top:5px;}
  .err{font-size:12px;color:var(--bad);margin-top:5px;}
  .input,select.input,textarea.input{width:100%;padding:10px 12px;border-radius:9px;border:1.5px solid var(--border);font-size:14px;color:var(--ink);outline:none;background:#fff;}
  .input.error{border-color:var(--bad);}
  .input:focus{border-color:var(--primary);}
  textarea.input{resize:vertical;}
  .segmented{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
  .seg-btn{padding:8px 16px;border-radius:8px;font-size:13.5px;font-weight:600;border:1.5px solid var(--border);background:#fff;color:var(--ink);cursor:pointer;}
  .seg-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .seg-btn.error{border-color:var(--bad);}
  .section-title{display:flex;align-items:center;gap:8px;margin:26px 0 14px;padding-bottom:10px;border-bottom:1.5px solid var(--border);font-size:14px;font-weight:700;color:var(--primary-dark);letter-spacing:.2px;text-transform:uppercase;}
  .btn{padding:10px 18px;border-radius:9px;font-size:13.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
  .btn-primary{background:var(--primary);color:#fff;border:none;}
  .btn-ghost{background:#fff;color:var(--primary);border:1.5px solid var(--primary);}
  .btn-subtle{background:var(--bg);color:var(--ink);border:1.5px solid var(--border);}
  .btn-danger{background:#fff;color:var(--bad);border:1.5px solid var(--bad);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 20px;}
  @media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr;} .type-grid{grid-template-columns:1fr !important;}}
  .type-card{padding:28px 16px;border-radius:14px;cursor:pointer;border:2px solid var(--border);background:#fff;text-align:left;}
  .type-card-title{font-weight:700;font-size:15.5px;color:var(--ink);margin-bottom:4px;}
  .type-card-sub{font-size:12.5px;color:var(--sub);}
  .progress{display:flex;gap:6px;margin-bottom:28px;}
  .progress div{flex:1;height:5px;border-radius:3px;background:var(--border);}
  .progress div.on{background:var(--primary);}
  .backlink{background:none;border:none;color:var(--primary);font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:0;}
  .filter-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:18px;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
  .stat-card{background:var(--card);border-radius:14px;padding:16px 18px;border:1px solid var(--border);}
  .stat-label{font-size:12px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.3px;margin-bottom:8px;}
  .stat-value{font-size:24px;font-weight:800;color:var(--ink);line-height:1;}
  .stat-sub{font-size:12px;color:var(--sub);margin-top:4px;}
  .chart-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
  .chart-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px;}
  @media (max-width:800px){.chart-row{grid-template-columns:1fr;} .chart-row3{grid-template-columns:1fr;}}
  .mini-bars{display:flex;gap:18px;align-items:flex-end;height:150px;padding-top:12px;}
  .mini-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .mini-bar-track{width:100%;max-width:64px;height:110px;background:var(--bg);border-radius:8px 8px 0 0;display:flex;align-items:flex-end;overflow:hidden;border:1px solid var(--border);border-bottom:none;}
  .mini-bar-fill{width:100%;border-radius:6px 6px 0 0;min-height:2px;transition:height .3s;}
  .mini-bar-value{font-weight:800;font-size:14px;margin-top:8px;color:var(--ink);}
  .mini-bar-label{font-size:11px;color:var(--sub);margin-top:2px;text-align:center;line-height:1.3;}
  .mini-bars-empty{color:var(--sub);font-size:12.5px;text-align:center;padding:40px 0;}
  .chart-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;}
  .chart-card-title{font-weight:700;font-size:12.5px;color:var(--ink);margin-bottom:6px;}
  .table-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
  .table-head{padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;padding:9px 12px;font-weight:700;color:var(--sub);font-size:11px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;background:var(--bg);position:sticky;top:0;}
  td{padding:9px 12px;color:var(--ink);white-space:nowrap;border-top:1px solid var(--border);}
  .scroll-x{overflow-x:auto;max-height:420px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
  .modal{background:#fff;border-radius:16px;width:440px;max-width:100%;max-height:80vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .modal-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:700;}
  .modal-body{padding:18px;overflow-y:auto;flex:1;}
  .tab-btn{padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--ink);}
  .tab-btn.active{border-color:var(--primary);background:var(--primary);color:#fff;}
  .list-row{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;margin-bottom:4px;background:var(--bg);}
  .success-box{max-width:480px;margin:60px auto;text-align:center;padding:32px;}
  .success-icon{width:64px;height:64px;border-radius:50%;background:#DCFCE7;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:30px;}
  .footer-note{text-align:center;font-size:11px;color:var(--sub);padding:10px 0 28px;}
  .close-x{background:none;border:none;cursor:pointer;font-size:18px;line-height:1;}
  .upload-card{background:var(--card);border:1.5px dashed var(--border);border-radius:14px;padding:22px;text-align:center;}
  .upload-card.active{border-color:var(--primary);background:#EFF6FF;}
  .step-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;background:var(--bg);border:1px solid var(--border);font-size:11.5px;font-weight:700;color:var(--sub);margin-right:6px;}
  .step-pill.on{background:var(--primary);color:#fff;border-color:var(--primary);}
  .map-row{display:grid;grid-template-columns:170px 1fr;gap:10px;align-items:center;margin-bottom:8px;}
  .map-row label{font-size:12.5px;font-weight:600;color:var(--ink);}
  .pill{padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block;}
  .pill-good{background:#DCFCE7;color:#166534;}
  .pill-bad{background:#FEE2E2;color:#991B1B;}
  .pill-neutral{background:#E2E8F0;color:#334155;}
  .pivot-table{border-collapse:collapse;font-size:11.5px;}
  .pivot-table th,.pivot-table td{padding:6px 10px;text-align:center;white-space:nowrap;border:1px solid var(--border);}
  .pivot-table th{background:var(--bg);font-weight:700;color:var(--sub);font-size:10.5px;text-transform:uppercase;letter-spacing:.2px;}
  .pivot-table .pivot-corner{position:sticky;left:0;background:#fff;text-align:left;z-index:2;}
  .pivot-table thead th.pivot-corner{background:var(--bg);z-index:3;}
  .fullscreen-overlay{position:fixed;inset:0;background:#fff;z-index:300;padding:20px 22px;overflow:auto;}

/* ===== Duty Roster (merged tab) styles — scoped under .dr-scope ===== */

.dr-scope{
  --dr-bg:#F5F7FB;
  --dr-panel:#FFFFFF;
  --dr-panel-2:#F1F5F9;
  --dr-panel-3:#E2E8F0;
  --dr-border:#E2E8F0;
  --dr-border-soft:#EEF2F7;
  --dr-text:#0F172A;
  --dr-text-dim:#64748B;
  --dr-text-dim2:#94A3B8;
  --dr-accent:#1D4ED8;
  --dr-accent-dark:#1E3A8A;
  --dr-blue:#1D4ED8;
  --dr-green:#16A34A;
  --dr-purple:#7C3AED;
  --dr-red:#DC2626;
  --dr-radius:10px;
  --dr-font-display:'Space Grotesk',-apple-system,sans-serif;
  --dr-font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
.dr-scope *{box-sizing:border-box;}
.dr-scope{
  background:var(--dr-bg);
  color:var(--dr-text);
  font-family:var(--dr-font-body);
  padding:18px 14px 60px;
  border-radius:14px;
}
.dr-wrap{max-width:980px;margin:0 auto;}

.dr-app-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.dr-lamp{
  width:38px;height:38px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #93c5fd, var(--dr-accent) 55%, var(--dr-accent-dark) 100%);
  box-shadow:0 0 18px rgba(29,78,216,0.35), inset 0 0 6px rgba(0,0,0,0.1);
  flex-shrink:0;
}
.dr-app-head h1{font-family:var(--dr-font-display);font-size:20px;margin:0;letter-spacing:0.2px;}
.dr-app-head p{margin:2px 0 0;color:var(--dr-text-dim);font-size:12.5px;}

.dr-tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--dr-panel);padding:5px;border-radius:12px;border:1px solid var(--dr-border-soft);flex-wrap:wrap;}
.dr-tab-btn{
  flex:1;padding:10px 8px;border:none;background:transparent;color:var(--dr-text-dim);
  font-family:var(--dr-font-body);font-weight:600;font-size:12.5px;border-radius:9px;cursor:pointer;
  transition:all .15s ease; text-align:center; line-height:1.3; min-width:110px;
}
.dr-tab-btn.dr-active{background:var(--dr-panel-3);color:var(--dr-accent);box-shadow:0 0 0 1px var(--dr-border) inset;}
.dr-tab-btn:hover:not(.dr-active){color:var(--dr-text);}

.dr-tab-panel{display:none;}
.dr-tab-panel.dr-active{display:block;animation:fade .18s ease;}
@keyframes fade{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:none;}}

.dr-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;}
.dr-field-label{font-size:11px;color:var(--dr-text-dim2);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:5px;display:block;}
.dr-scope select, .dr-scope input[type=text]{
  background:var(--dr-panel-2);border:1px solid var(--dr-border);color:var(--dr-text);
  padding:8px 9px;border-radius:8px;font-family:var(--dr-font-body);font-size:13px;
  outline:none; min-width:0;
}
.dr-scope select:focus, .dr-scope input:focus{border-color:var(--dr-accent);box-shadow:0 0 0 3px rgba(29,78,216,0.15);}
.dr-month-select-box{min-width:170px;}
select.dr-wide{width:100%;}

.dr-btn{
  border:1px solid var(--dr-border);background:var(--dr-panel-2);color:var(--dr-text);
  padding:9px 14px;border-radius:8px;font-family:var(--dr-font-body);font-weight:600;font-size:13px;
  cursor:pointer;transition:all .12s ease; white-space:nowrap;
}
.dr-btn:hover{border-color:var(--dr-accent);}
.dr-btn.dr-primary{background:var(--dr-accent);border-color:var(--dr-accent);color:#fff;}
.dr-btn.dr-primary:hover{background:#1E40AF;}
.dr-btn.dr-ghost{background:transparent;}
.dr-btn.dr-small{padding:6px 10px;font-size:12px;}
.dr-btn:disabled{opacity:0.45;cursor:not-allowed;}

.dr-summary-strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.dr-chip{font-size:11.5px;padding:6px 10px;border-radius:100px;border:1px solid var(--dr-border);color:var(--dr-text-dim);background:var(--dr-panel-2);}
.dr-chip b{color:var(--dr-text);}
.dr-chip.dr-dot::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle;}
.dr-chip.dr-working::before{background:var(--dr-text-dim2);}
.dr-chip.dr-weekly::before{background:var(--dr-blue);}
.dr-chip.dr-public::before{background:var(--dr-green);}
.dr-chip.dr-festival::before{background:var(--dr-purple);}

.dr-date-card{
  background:var(--dr-panel);border:1px solid var(--dr-border-soft);border-radius:var(--dr-radius);
  margin-bottom:10px; overflow:hidden; position:relative;
}
.dr-date-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;}
.dr-date-card.dr-working::before{background:var(--dr-border);}
.dr-date-card.dr-weekly::before{background:var(--dr-blue);}
.dr-date-card.dr-public::before{background:var(--dr-green);}
.dr-date-card.dr-festival::before{background:var(--dr-purple);}

.dr-date-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px 12px 18px;cursor:pointer;
}
.dr-date-head:hover{background:rgba(255,255,255,0.015);}
.dr-date-main{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.dr-nep-date{font-family:var(--dr-font-display);font-size:16px;font-weight:600;}
.dr-weekday{font-size:12px;color:var(--dr-text-dim);}
.dr-eng-date{font-size:12px;color:var(--dr-text-dim2);}
.dr-type-badge{font-size:10.5px;padding:3px 9px;border-radius:100px;font-weight:600;letter-spacing:0.3px;}
.dr-type-badge.dr-working{background:rgba(255,255,255,0.05);color:var(--dr-text-dim);}
.dr-type-badge.dr-weekly{background:rgba(91,155,240,0.15);color:var(--dr-blue);}
.dr-type-badge.dr-public{background:rgba(79,191,139,0.15);color:var(--dr-green);}
.dr-type-badge.dr-festival{background:rgba(197,131,224,0.15);color:var(--dr-purple);}

.dr-count-pill{font-size:11px;color:var(--dr-text-dim2);}
.dr-chevron{color:var(--dr-text-dim2);transition:transform .15s ease;font-size:11px;}
.dr-date-card.dr-open .dr-chevron{transform:rotate(180deg);}

.dr-date-body{display:none;padding:0 14px 14px 18px;border-top:1px solid var(--dr-border-soft);}
.dr-date-card.dr-open .dr-date-body{display:block;}

.dr-duty-table-wrap{overflow-x:auto;margin-top:10px;}
.dr-duty-table{width:100%;border-collapse:collapse;min-width:760px;}
.dr-duty-table th{
  text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:0.4px;color:var(--dr-text-dim2);
  padding:8px 6px;border-bottom:1px solid var(--dr-border-soft); white-space:nowrap;
}
.dr-duty-table td{padding:6px 6px;border-bottom:1px solid var(--dr-border-soft);vertical-align:middle;}
.dr-duty-table tr:last-child td{border-bottom:none;}
.dr-duty-table select, .dr-duty-table input{width:100%;font-size:12.5px;padding:7px 8px;}
.dr-id-cell{
  font-size:11.5px;color:var(--dr-text-dim2);white-space:nowrap;padding:0 6px;font-family:monospace;
}
.dr-remove-cell{width:34px;text-align:center;}
.dr-iconbtn{
  background:transparent;border:1px solid var(--dr-border);color:var(--dr-text-dim);
  width:28px;height:28px;border-radius:7px;cursor:pointer;font-size:13px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.dr-iconbtn:hover{border-color:var(--dr-red);color:var(--dr-red);}

.dr-empty-state{
  text-align:center;color:var(--dr-text-dim2);font-size:12.5px;padding:18px 10px;
  border:1px dashed var(--dr-border);border-radius:9px;margin-top:8px;
}
.dr-card-actions{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px;}
.dr-save-status{font-size:11.5px;color:var(--dr-green);opacity:0;transition:opacity .2s ease;}
.dr-save-status.dr-show{opacity:1;}

.dr-mduty-table{width:100%;border-collapse:collapse;background:var(--dr-panel);border:1px solid var(--dr-border-soft);border-radius:var(--dr-radius);overflow:hidden;}
.dr-mduty-table th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;color:var(--dr-text-dim2);
  padding:10px 10px;background:var(--dr-panel-2);border-bottom:1px solid var(--dr-border-soft);
}
.dr-mduty-table td{padding:8px 10px;border-bottom:1px solid var(--dr-border-soft);font-size:13px;vertical-align:middle;}
.dr-mduty-table tr:last-child td{border-bottom:none;}
.dr-emp-name-cell{font-weight:600;}
.dr-emp-id-cell{font-size:11px;color:var(--dr-text-dim2);font-family:monospace;}

.dr-top-actions{display:flex;justify-content:flex-end;margin:14px 0 30px;gap:10px;}

.dr-snapshot-wrap{
  background:#ffffff;border-radius:10px;padding:14px;overflow-x:auto;
}
.dr-snapshot-title{font-family:var(--dr-font-display);color:#1a212a;font-size:15px;font-weight:700;margin:0 0 10px;}
.dr-snapshot-table{width:100%;border-collapse:collapse;min-width:820px;}
.dr-snapshot-table th{
  background:#1a212a;color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:0.3px;
  padding:8px 10px;text-align:left;white-space:nowrap;
}
.dr-snapshot-table td{padding:7px 10px;font-size:12.5px;color:#1a212a;border-bottom:1px solid #e4e8ee;white-space:nowrap;}
.dr-snapshot-table tr:nth-child(even) td{background:#f4f7fb;}
.dr-snapshot-table tr.dr-type-weekly td:first-child{border-left:3px solid #5b9bf0;}
.dr-snapshot-table tr.dr-type-public td:first-child{border-left:3px solid #4fbf8b;}

/* ---------------- render engine (preserves focus across re-renders) ---------------- */
function render(){
  const active=document.activeElement;
  const activeId=active&&active.id?active.id:null;
  const selStart=active&&typeof active.selectionStart==="number"?active.selectionStart:null;
  const scrollX=window.scrollX, scrollY=window.scrollY;
  /* Some report blocks (Problem Type / Diagnosed / Solved Solution) sit inside their own
     scrollable box — a fresh re-render rebuilds that box from scratch, so its internal
     scrollTop silently resets to 0 even though the outer page scroll is fine. That's what
     made expanding/collapsing a Diagnosed row look like it "jumped to the top": the box
     itself snapped back to its first row. Saving/restoring scrollTop per box (matched by
     id, since a box's identity is stable across renders even though the DOM node isn't)
     fixes that the same way the window-scroll fix above fixes the page-level jump. */
  const innerScroll={};
  document.querySelectorAll(".scroll-preserve[id]").forEach(el=>{ innerScroll[el.id]=el.scrollTop; });

  document.getElementById("app").innerHTML = renderApp();

  if(activeId){
    const el=document.getElementById(activeId);
    if(el){ el.focus(); if(selStart!=null&&el.setSelectionRange){ try{el.setSelectionRange(selStart,selStart);}catch(e){} } }
  }
  Object.keys(innerScroll).forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.scrollTop=innerScroll[id];
  });
  window.scrollTo(scrollX,scrollY);
}

async function loadNoteIfNeeded(){
  if(state.note.loaded) return;
  const raw=await sGet("app_notes",true);
  if(raw){
    try{ const parsed=JSON.parse(raw); if(Array.isArray(parsed)) state.note.entries=parsed; }catch(e){}
  }
  state.note.loaded=true;
}
async function addNoteEntry(){
  const text=(state.note.draftText||"").trim();
  if(!text) return;
  state.note.saving=true; render();
  const entry={id:newId(),category:state.note.draftCategory,status:"Noted",text,createdAt:new Date().toISOString()};
  state.note.entries=[entry,...state.note.entries];
  const ok=await sSet("app_notes",JSON.stringify(state.note.entries),true).catch(()=>null);
  state.note.saving=false;
  if(ok){ state.note.draftText=""; }
  else { state.note.entries=state.note.entries.filter(x=>x.id!==entry.id); alert("Could not save — please try again."); }
  render();
}
async function deleteNoteEntry(id){
  const prev=state.note.entries;
  state.note.entries=state.note.entries.filter(e=>e.id!==id);
  render();
  const ok=await sSet("app_notes",JSON.stringify(state.note.entries),true).catch(()=>null);
  if(!ok){ state.note.entries=prev; render(); alert("Could not delete — please try again."); }
}
async function updateNoteEntryStatus(id,status){
  const prev=state.note.entries;
  const entry=state.note.entries.find(e=>e.id===id);
  if(!entry) return;
  const prevStatus=entry.status;
  entry.status=status;
  render();
  const ok=await sSet("app_notes",JSON.stringify(state.note.entries),true).catch(()=>null);
  if(!ok){ entry.status=prevStatus; render(); alert("Could not save — please try again."); }
}

/* ---------------- Date Finder ---------------- */
function findEngDateFromNepali(year,monthName,day){
  if(!year||!monthName||!day) return null;
  const dayStr=String(day).padStart(2,"0");
  for(const eng in NEP_DATE_MAP){
    const info=NEP_DATE_MAP[eng];
    if(String(info.year)===String(year) && info.month===monthName){
      const parts=info.nep.split("/");
      if(parts[2]===dayStr) return eng;
    }
  }
  return null;
}
function weekdayNameOf(engDateStr){
  const d=parseDateVal(engDateStr);
  if(!d) return "";
  return d.toLocaleDateString('en-US',{weekday:'long'});
}

  const nepEngResult=(f.nepYear&&f.nepMonth&&f.nepDay)?findEngDateFromNepali(f.nepYear,f.nepMonth,f.nepDay):null;
  const nepOpts=nepFilterOptionsFromMap();
  const dayOpts=Array.from({length:32},(_,i)=>i+1);
  return `<div style="max-width:760px;margin:0 auto;">

        ? (engResult
            ? `<div class="banner banner-info" style="margin-top:0;"><strong>${esc(weekdayNameOf(f.engDate))}, ${esc(f.engDate)}</strong> = Nepali date <strong>${esc(engResult.nep)}</strong> (${esc(engResult.month)} ${esc(engResult.year)}, FY ${esc(engResult.fy)})</div>`
            : `<div class="banner">No Nepali date on file for ${esc(f.engDate)} — it's outside the loaded FY 83-84 calendar range.</div>`)
        : ""}
    </div>

    <div class="table-wrap" style="padding:18px;">
      <div style="font-weight:700;font-size:13.5px;margin-bottom:12px;color:var(--primary-dark);">Nepali → English</div>
      <div class="grid3">
        <div class="field">
          <label>Nepali Year</label>
          <select class="input" data-field="nepYear" data-mode="datefinder-nep-select">
            <option value="">Select...</option>
            ${nepOpts.yearList.map(y=>`<option value="${y}" ${String(f.nepYear)===String(y)?'selected':''}>${y}</option>`).join("")}
          </select>

            <option value="">Select...</option>
            ${NEP_MONTH_ORDER.map(m=>`<option ${f.nepMonth===m?'selected':''}>${esc(m)}</option>`).join("")}
          </select>
        </div>
        <div class="field">
          <label>Day</label>
          <select class="input" data-field="nepDay" data-mode="datefinder-nep-select">
            <option value="">Select...</option>
            ${dayOpts.map(d=>`<option value="${d}" ${String(f.nepDay)===String(d)?'selected':''}>${d}</option>`).join("")}
          </select>

/* ---------------- entry form ---------------- */
function validatePowerLevel(v){
  if(!v) return "Required";
  if(!/^-\d{1,2}(\.\d{1,2})?$/.test(v)) return 'Use format like -23.99 (must start with "-")';
  const n=parseFloat(v);
  if(n<-65||n>0) return "Must be between -65 and 0";
  return null;
}

    ${hint&&!error?`<div class="hint">${esc(hint)}</div>`:""}
    ${error?`<div class="err">⚠ ${esc(error)}</div>`:""}
  </div>`;
}

function toCSV(rows){
  if(!rows.length) return "";
  const cols=Object.keys(rows[0]);
  const q=v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`;
  return [cols.join(","),...rows.map(r=>cols.map(c=>q(r[c])).join(","))].join("\n");
}
function toJSON(rows){ return JSON.stringify(rows, null, 2); }
function downloadFile(content,filename,mime){
  try{
    const blob=new Blob([content],{type:mime});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=filename; a.style.display="none";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(err){
    try{
      window.open("data:"+mime+";charset=utf-8,"+encodeURIComponent(content), "_blank");
    }catch(err2){
      alert("Could not export the file. Your browser may be blocking downloads or pop-ups for this page.");
    }
  }
}
function exportExcel(rows,filename,sheetName){

    XLSX.utils.book_append_sheet(wb,ws,sheetName||"Sheet1");

}

/* Compact line chart for series with many points (e.g. day-of-month, 28-32 points) where
   the vertical-bar chart gets too wide/heavy to read at a glance. Single color, dots with
   a hover tooltip (native <title>), value shown above every Nth point only so labels don't
   collide, and the whole thing scrolls horizontally rather than shrinking unreadably. */
function sparklineChart(items,opts){
  if(!items.length) return `<div class="mini-bars-empty">No data yet</div>`;
  opts=opts||{};
  const stepPx=46;
  const w=Math.max(280, 40+items.length*stepPx);
  const h=110;
  const padL=20, padR=20, padT=20, padB=20;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const values=items.map(i=>i.value);
  const max=Math.max(...values,0);
  const min=Math.min(...values,0);
  const range=(max-min)||1;
  const color=opts.color||"#1D4ED8";
  const stepX = items.length>1 ? plotW/(items.length-1) : 0;
  const pts=items.map((it,idx)=>({
    x: padL+stepX*idx,
    y: padT+plotH-((it.value-min)/range)*plotH,
    label: it.label, value: it.value, suffix: it.suffix||""
  }));
  const linePath=pts.map((p,idx)=>`${idx===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  const areaPath=`${linePath} L${pts[pts.length-1].x.toFixed(1)},${(padT+plotH).toFixed(1)} L${pts[0].x.toFixed(1)},${(padT+plotH).toFixed(1)} Z`;
  return `<div style="overflow-x:auto;">
    <svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="display:block;">
      <path d="${areaPath}" fill="${color}" opacity="0.08"></path>
      <path d="${linePath}" fill="none" stroke="${color}" stroke-width="2"></path>
      ${pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.6" fill="${color}"><title>${esc(String(p.label))}: ${p.value}${p.suffix}</title></circle>`).join("")}

      ${pts.map(p=>`<text x="${p.x.toFixed(1)}" y="${h-4}" font-size="9" text-anchor="middle" fill="var(--sub)">${esc(String(p.label))}</text>`).join("")}
    </svg>
  </div>`;
}

async function loadAudits(){
  state.dashboard.loading=true; render();
  try{
    const listRes=await sList("audit:",true);
    const keys=(listRes&&listRes.keys)||[];
    const results=await Promise.all(keys.map(async k=>{
      const key=typeof k==="string"?k:k.key;
      const raw=await sGet(key,true);
      if(!raw) return null;
      try{ return JSON.parse(raw);}catch(e){ return null; }
    }));
    const fetched=results.filter(Boolean);
    if(fetched.length){
      const byId={};
      fetched.forEach(r=>byId[r.id]=r);
      state.dashboard.audits.forEach(r=>{ if(!byId[r.id]) byId[r.id]=r; });
      state.dashboard.audits=Object.values(byId).sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
    }
    if(state.datasetsLoaded){
      await mergeDuplicateNames("fas");
      await mergeDuplicateNames("olts");
    }
    await archiveDuplicateAudits();
  }catch(e){}
  state.dashboard.loading=false;
  render();
}
async function archiveDuplicateAudits(){
  const byTicket={};
  state.dashboard.audits.forEach(a=>{
    const k=String(a.customerId);
    if(!byTicket[k]) byTicket[k]=[];
    byTicket[k].push(a);
  });
  const keep=[],toArchive=[];
  Object.values(byTicket).forEach(list=>{
    if(list.length<=1){ keep.push(...list); return; }
    const sorted=list.slice().sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
    keep.push(sorted[0]);
    toArchive.push(...sorted.slice(1));
  });
  if(!toArchive.length) return;
  for(const old of toArchive){
    await sSet("audit_archive:"+old.id,JSON.stringify(old),true).catch(()=>{});
    await sDelete("audit:"+old.id,true).catch(()=>{});
  }
  state.dashboard.audits=keep.sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
}
function filteredAudits(){
  const d=state.dashboard;
  return d.audits.filter(a=>{
    if(d.fType&&a.auditType!==d.fType) return false;
    if(d.fMethod&&a.auditMethod!==d.fMethod) return false;
    if(d.fOlt&&a.olt!==d.fOlt) return false;
    if(d.fAuditor&&a.adutor!==d.fAuditor) return false;
    if(d.fFa&&a.installedBy!==d.fFa) return false;
    if(d.fNepYear||d.fNepMonth){
      const ni=nepInfo(a.date);
      if(!ni) return false;
      if(d.fNepYear&&String(ni.year)!==d.fNepYear) return false;
      if(d.fNepMonth&&ni.month!==d.fNepMonth) return false;
    }
    if(d.q){
      const s=d.q.toLowerCase();
      const hay=`${a.customerName} ${a.customerId}`.toLowerCase();
      if(!hay.includes(s)) return false;
    }
    return true;
  });
}
function fieldPass(value,kind){
  if(kind==="yesno"){
    if(value==="Yes") return 1;
    if(value==="No") return 0;
    return null;
  }
  if(kind==="splitter"){
    if(value==="Close") return 1;
    if(value==="Open"||value==="Need to Maintain") return 0;
    return null;
  }
  if(kind==="clamp"){
    if(value==="Proper") return 1;
    if(value==="Inproper") return 0;
    return null;
  }
  if(kind==="pl"){
    const q=plQuality(value);
    if(q==="Good") return 1;
    if(q==="Bad") return 0;
    return null;
  }
  return null;
}

function computeStats(filtered){
  const today=todayStr();

  const followUp=filtered.filter(a=>a.auditMethod==="Customer Follow Up").length;
  const install=filtered.filter(a=>a.auditType==="Installation").length;
  const trouble=filtered.filter(a=>a.auditType==="Troubleshoot").length;

  const appYes=followUpDone.filter(a=>a.mobileApp==="Yes").length;
  const csatYes=followUpDone.filter(a=>a.csatEducated==="Yes").length;

function computeFaPerformance(filtered){

    const name=a.installedBy;
    if(!name) return;
    if(!byFa[name]) byFa[name]={name,total:0,install:0,trouble:0,desk:0,followUp:0,pls:[],appYes:0,csatYes:0,followUpDone:0,installScores:[],troubleScores:[],allScores:[],fieldStats:{}};
    const g=byFa[name];
    g.total++;
    if(a.auditType==="Installation") g.install++;
    if(a.auditType==="Troubleshoot") g.trouble++;
    if(a.auditMethod==="Desk Audit") g.desk++;
    if(a.auditMethod==="Customer Follow Up") g.followUp++;
    const n=parseFloat(a.powerLevel);
    if(!isNaN(n)) g.pls.push(n);
    if(a.followUpRemarks==="Follow Up Done"){
      g.followUpDone++;
      if(a.mobileApp==="Yes") g.appYes++;
      if(a.csatEducated==="Yes") g.csatYes++;
    }
    const score=recordScore(a);
    if(score!==null){
      g.allScores.push(score);
      if(a.auditType==="Installation") g.installScores.push(score);
      else g.troubleScores.push(score);
    }
    const fields=recordChecklistFields(a);
    Object.entries(fields).forEach(([label,val])=>{
      if(val===null) return;
      if(!g.fieldStats[label]) g.fieldStats[label]={pass:0,fail:0};
      if(val===1) g.fieldStats[label].pass++; else g.fieldStats[label].fail++;
    });
  });
  const avg=arr=>arr.length?arr.reduce((s,v)=>s+v,0)/arr.length:null;
  return Object.values(byFa).map(g=>{
    const plGood=g.pls.filter(n=>n>=PL_THRESHOLD).length;
    const plBad=g.pls.filter(n=>n<PL_THRESHOLD).length;
    const avgPl=g.pls.length?(g.pls.reduce((s,n)=>s+n,0)/g.pls.length).toFixed(2):"—";
    const overallAvg=avg(g.allScores);
    const installAvg=avg(g.installScores);
    const troubleAvg=avg(g.troubleScores);

    const fieldEntries=Object.entries(g.fieldStats).map(([label,st])=>({
      label, total:st.pass+st.fail, pct: (st.pass+st.fail)?Math.round(100*st.pass/(st.pass+st.fail)):null
    })).filter(f=>f.total>=2);
    const byBest=fieldEntries.slice().sort((a,b)=>b.pct-a.pct||b.total-a.total);
    const byWorst=fieldEntries.slice().sort((a,b)=>a.pct-b.pct||b.total-a.total);
    const strengths=byBest.filter(f=>f.pct>=80);
    const weaknesses=byWorst.filter(f=>f.pct<60);

    return {name:g.name,total:g.total,install:g.install,trouble:g.trouble,desk:g.desk,followUp:g.followUp,
      avgPl,plGood,plBad,
      appPct:g.followUpDone?Math.round(100*g.appYes/g.followUpDone)+"%":"—",
      csatPct:g.followUpDone?Math.round(100*g.csatYes/g.followUpDone)+"%":"—",
      overall: overallAvg==null?null:Math.round(100*overallAvg),
      installPct: installAvg==null?null:Math.round(100*installAvg),
      troublePct: troubleAvg==null?null:Math.round(100*troubleAvg),
      strengths, weaknesses};
  }).sort((a,b)=>{
    if(a.overall==null&&b.overall==null) return b.total-a.total;
    if(a.overall==null) return 1;
    if(b.overall==null) return -1;
    return b.overall-a.overall;
  });
}

/* "Needs Attention" — pulls the single most urgent signal from a few different reports

function computeNeedsAttention(){

    if(!(state.datasets[source]||[]).length) return;
    const {pending}=computeAuditMatch(source);

    }
  });
  const complainers=computeTopComplainUsers(2);
  if(complainers.length && complainers[0].count>=3){

    items.push({icon:"🚨",color:"var(--bad)",text:`${top.username} has ${top.count} repeat tickets — worth a closer look`,action:"nav-reports-tab",value:"olt"});
  }
  if((state.datasets.fieldvisit||[]).length){
    const faStats=computeFaRepeatStats(30);
    if(faStats.list.length && faStats.list[0].total>=2){
      const top=faStats.list[0];
      items.push({icon:"🔁",color:"var(--bad)",text:`${top.fa} has ${top.total} tickets that led to a repeat visit within 30 days`,action:"nav-reports-tab",value:"vs"});
    }
    const cm=state.columnMaps.fieldvisit||{};
    if(cm.solveDurHr!==null&&cm.solveDurHr!==undefined){
      const breach48=state.datasets.fieldvisit.filter(r=>{const h=parseFloat(r.solveDurHr); return !isNaN(h)&&h>48;});
      if(breach48.length){
        items.push({icon:"🐢",color:"var(--bad)",text:`${breach48.length} ticket${breach48.length>1?'s':''} took over 48 hours to solve`,action:"nav-reports-tab",value:"performance"});
      }
    }
    const dateField=projectionDateField();
    const eligible=computeMonthsWithData(dateField).filter(mm=>NEP_MONTH_ORDER.indexOf(mm)>0);
    if(eligible.length){
      const proj=computeProjectionData(eligible[eligible.length-1],dateField,"problem");
      if(proj && proj.asOfDay>0){
        const risers=proj.rows
          .filter(rr=>rr.changePct!=null && rr.changePct>0)
          .map(rr=>({...rr, diff: Math.ceil(rr.projected)-rr.prevCount}))
          .filter(rr=>rr.diff>=6)
          .sort((a,b)=>b.diff-a.diff);
        if(risers.length){
          const top=risers[0];
          items.push({icon:"📈",color:"var(--bad)",text:`"${top.label}" projected +${top.diff} tickets this month (~${Math.ceil(top.projected)} total, ${top.changePct>=0?'+':''}${top.changePct.toFixed(0)}%) vs ${proj.prevMonth}`,action:"nav-reports-tab",value:"projection"});
        }
      }
    }
  }
  return items;
}

/* ===== Power Level Next Level — Yesterday vs Today ===== */
function powerLevelNextRows(matrix){
  if(!Array.isArray(matrix)||!matrix.length) return {rows:[],usernameCol:-1,powerCol:-1};
  const norm=s=>String(s==null?"":s).trim().toLowerCase().replace(/[^a-z0-9]+/g," ");
  let hi=0, score=-1;
  for(let i=0;i<Math.min(matrix.length,12);i++){
    const row=matrix[i]||[];
    const sc=row.reduce((n,v)=>{const x=norm(v); return n+(x.includes("user")?3:0)+(x.includes("power")?3:0)+(x.includes("level")?1:0);},0);
    if(sc>score){score=sc;hi=i;}
  }
  const headers=(matrix[hi]||[]).map(v=>String(v==null?"":v).trim());
  const nh=headers.map(norm);
  const findCol=(tests)=>nh.findIndex(h=>tests.some(t=>h===t||h.includes(t)));
  const usernameCol=findCol(["username","user name","customer username","customer name","user"]);
  const powerCol=findCol(["power level","power","rx power","optical power","power lvl"]);
  if(usernameCol<0||powerCol<0) return {rows:[],usernameCol,powerCol,headers};
  const rows=[];
  for(let i=hi+1;i<matrix.length;i++){
    const r=matrix[i]||[];
    const username=String(r[usernameCol]??"").trim();
    const raw=r[powerCol];
    const n=parseFloat(String(raw??"").replace(/,/g,"").trim());
    if(!username) continue;
    const valid=Number.isFinite(n)&&n>=-100&&n<=0;
    rows.push({username,power:n,raw:raw,valid});
  }
  return {rows,usernameCol,powerCol,headers};
}

async function renameListItem(tab,oldVal,newVal){
  newVal=(newVal||"").trim();
  if(!newVal || newVal===oldVal){ state.manageEditKey=null; render(); return; }

  state.lists[tab]=Array.from(new Set(state.lists[tab].map(x=>x===oldVal?newVal:x)));
  const keyMap={olts:"config:olts",auditors:"config:auditors",fas:"config:fas"};
  await sSet(keyMap[tab],JSON.stringify(state.lists[tab]),true);

  const auditField={olts:"olt",auditors:"adutor",fas:"installedBy"}[tab];
  const changedAudits=[];
  state.dashboard.audits.forEach(a=>{
    if(a[auditField]===oldVal){ a[auditField]=newVal; changedAudits.push(a); }
  });
  for(const a of changedAudits){ await sSet("audit:"+a.id, JSON.stringify(a), true).catch(()=>{}); }

  if(tab==="olts"){
    ["installation","fieldvisit"].forEach(t=>{
      state.datasets[t]=(state.datasets[t]||[]).map(r=> r.olt===oldVal ? Object.assign({},r,{olt:newVal}) : r);
    });
    await sSet("dataset:installation",JSON.stringify(state.datasets.installation),true);
    await sSet("dataset:fieldvisit",JSON.stringify(state.datasets.fieldvisit),true);
  }
  if(tab==="fas"){
    state.datasets.installation=(state.datasets.installation||[]).map(r=> r.installedBy===oldVal ? Object.assign({},r,{installedBy:newVal}) : r);
    state.datasets.fieldvisit=(state.datasets.fieldvisit||[]).map(r=> r.solvedBy===oldVal ? Object.assign({},r,{solvedBy:newVal}) : r);
    await sSet("dataset:installation",JSON.stringify(state.datasets.installation),true);
    await sSet("dataset:fieldvisit",JSON.stringify(state.datasets.fieldvisit),true);
  }

  state.manageEditKey=null;
  render();
}

function guessColumnMap(headers,fields){
  const map={};
  fields.forEach(f=>{
    const kws=FIELD_KEYWORDS[f.key]||[f.key.toLowerCase()];
    let found=null;
    /* Pass 1: exact match (trimmed) — most reliable, avoids short keywords like "pl"
       accidentally matching "Splitter" or "PayPlan" via substring. */
    headers.forEach((h,idx)=>{
      if(found!=null||h==null) return;
      const hl=String(h).toLowerCase().trim();
      if(kws.some(k=>hl===k)) found=idx;
    });
    /* Pass 2: substring fallback for headers that don't exactly match a keyword. */
    if(found==null){
      headers.forEach((h,idx)=>{
        if(found!=null||h==null) return;
        const hl=String(h).toLowerCase();
        if(kws.some(k=>hl.includes(k))) found=idx;
      });
    }
    map[f.key]=found;
  });
  return map;
}
function guessHeaderRow(rows){
  let best=0,bestScore=-1;
  for(let i=0;i<Math.min(10,rows.length);i++){
    const r=rows[i]||[];
    const nonEmpty=r.filter(c=>c!==null&&c!==undefined&&String(c).trim()!=="").length;
    const strCount=r.filter(c=>typeof c==="string").length;
    const score=nonEmpty+strCount;
    if(nonEmpty>=3&&score>bestScore){ bestScore=score; best=i; }
  }
  return best;
}
function parseFileToRows(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=(e)=>{
      try{
        const data=new Uint8Array(e.target.result);
        const wb=XLSX.read(data,{type:"array"});
        const sheet=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:null,raw:true});
        resolve(rows);
      }catch(err){ reject(err); }
    };
    reader.onerror=()=>reject(new Error("Could not read the file."));
    reader.readAsArrayBuffer(file);
  });
}

function titleCaseDotted(s){
  if(!s) return s;

  if(/\./.test(s) && !/\s/.test(s)){
    return s.split(".").filter(Boolean).map(p=>p.charAt(0).toUpperCase()+p.slice(1).toLowerCase()).join(" ");
  }
  return s;
}

function ensureListHas(tab,val){
  if(val && !state.lists[tab].includes(val)){
    state.lists[tab]=[...state.lists[tab], val];
    return true;
  }
  return false;
}
async function seedInitialDatasetsIfEmpty(){
  if(state.datasets.installation.length || state.datasets.fieldvisit.length || state.uploadHistory.length) return;
  if(!SEED_INSTALLATION.length && !SEED_FIELDVISIT.length) return;
  state.datasets.installation=SEED_INSTALLATION.slice();
  state.datasets.fieldvisit=SEED_FIELDVISIT.slice();

  let listsChanged=false;
  SEED_INSTALLATION.forEach(r=>{
    if(ensureListHas("fas",r.installedBy)) listsChanged=true;
    if(ensureListHas("olts",r.olt)) listsChanged=true;
  });
  SEED_FIELDVISIT.forEach(r=>{
    if(ensureListHas("fas",r.solvedBy)) listsChanged=true;
    if(ensureListHas("olts",r.olt)) listsChanged=true;
  });
  if(listsChanged){
    await sSet("config:fas",JSON.stringify(state.lists.fas),true).catch(()=>{});
    await sSet("config:olts",JSON.stringify(state.lists.olts),true).catch(()=>{});
  }

  state.columnMaps.installation={ticketId:0,username:1,olt:2,installedBy:3,createDate:4,paymentStatus:5};
  state.columnMaps.fieldvisit={ticketId:0,username:1,olt:2,splitter:3,solvedBy:4,problemType:5,diagnosed:6,solution:7,openDate:8,solvedDate:9,quickSupport:10,solveDurHr:11,team:12};

  await sSet("dataset:installation",JSON.stringify(state.datasets.installation),true).catch(()=>{});
  await sSet("dataset:fieldvisit",JSON.stringify(state.datasets.fieldvisit),true).catch(()=>{});
  await sSet("column_map:installation",JSON.stringify(state.columnMaps.installation),true).catch(()=>{});
  await sSet("column_map:fieldvisit",JSON.stringify(state.columnMaps.fieldvisit),true).catch(()=>{});

  const now=new Date().toISOString();
  state.uploadHistory=[
    {id:newId(),type:"fieldvisit",fileName:"initial load",date:now,uploadedBy:"System",total:SEED_FIELDVISIT.length,imported:SEED_FIELDVISIT.length,duplicates:0,replaced:false,lastDataDate:computeMaxDateInRecords(SEED_FIELDVISIT,"solvedDate")},
    {id:newId(),type:"installation",fileName:"initial load",date:now,uploadedBy:"System",total:SEED_INSTALLATION.length,imported:SEED_INSTALLATION.length,duplicates:0,replaced:false,lastDataDate:computeMaxDateInRecords(SEED_INSTALLATION,"createDate")}
  ];
  await sSet("upload_history",JSON.stringify(state.uploadHistory),true).catch(()=>{});
}
async function loadDatasets(){
  const [instRaw,fvRaw,mapInst,mapFv,hist]=await Promise.all([
    sGet("dataset:installation",true),
    sGet("dataset:fieldvisit",true),
    sGet("column_map:installation",true),
    sGet("column_map:fieldvisit",true),
    sGet("upload_history",true)
  ]);
  try{ state.datasets.installation=instRaw?JSON.parse(instRaw):[]; }catch(e){ state.datasets.installation=[]; }
  try{ state.datasets.fieldvisit=fvRaw?JSON.parse(fvRaw):[]; }catch(e){ state.datasets.fieldvisit=[]; }
  try{ state.columnMaps.installation=mapInst?JSON.parse(mapInst):{}; }catch(e){}
  try{ state.columnMaps.fieldvisit=mapFv?JSON.parse(mapFv):{}; }catch(e){}
  try{ state.uploadHistory=hist?JSON.parse(hist):[]; }catch(e){ state.uploadHistory=[]; }
  await seedInitialDatasetsIfEmpty();
  state.datasetsLoaded=true;
}
async function mergeDuplicateNames(tab){
  const auditField = tab==="fas" ? "installedBy" : "olt";
  const groups={};
  state.lists[tab].forEach(name=>{
    const key=titleCaseDotted(name).toLowerCase();
    if(!groups[key]) groups[key]=[];
    groups[key].push(name);
  });
  const renameMap={};
  Object.values(groups).forEach(variants=>{
    if(variants.length<2) return;
    const canon = variants.find(v=>/\./.test(v) && !/\s/.test(v)) || variants[0];
    variants.forEach(v=>{ if(v!==canon) renameMap[v]=canon; });
  });
  if(!Object.keys(renameMap).length) return;

  state.lists[tab]=Array.from(new Set(state.lists[tab].map(x=>renameMap[x]||x)));
  const keyMapCfg={olts:"config:olts",auditors:"config:auditors",fas:"config:fas"};
  await sSet(keyMapCfg[tab],JSON.stringify(state.lists[tab]),true).catch(()=>{});

  const changedAudits=[];
  state.dashboard.audits.forEach(a=>{
    if(renameMap[a[auditField]]){ a[auditField]=renameMap[a[auditField]]; changedAudits.push(a); }
  });
  for(const a of changedAudits){ await sSet("audit:"+a.id, JSON.stringify(a), true).catch(()=>{}); }

  let dsChanged=false;
  const instField = tab==="fas" ? "installedBy" : "olt";
  const fvField = tab==="fas" ? "solvedBy" : "olt";
  state.datasets.installation=(state.datasets.installation||[]).map(r=>{
    if(renameMap[r[instField]]){ dsChanged=true; return Object.assign({},r,{[instField]:renameMap[r[instField]]}); }
    return r;
  });
  state.datasets.fieldvisit=(state.datasets.fieldvisit||[]).map(r=>{
    if(renameMap[r[fvField]]){ dsChanged=true; return Object.assign({},r,{[fvField]:renameMap[r[fvField]]}); }
    return r;
  });
  if(dsChanged){
    await sSet("dataset:installation",JSON.stringify(state.datasets.installation),true).catch(()=>{});
    await sSet("dataset:fieldvisit",JSON.stringify(state.datasets.fieldvisit),true).catch(()=>{});
  }
}
async function handleUploadFile(input){
  const file=input.files[0];
  if(!file) return;
  state.upload.busy=true; state.upload.error=null; render();
  try{
    const rows=await parseFileToRows(file);
    const nonEmptyRows=rows.filter(r=>r&&r.some(c=>c!==null&&c!==undefined&&String(c).trim()!==""));
    if(!nonEmptyRows.length) throw new Error("This file has no readable rows.");
    state.upload.fileName=file.name;
    state.upload.rawRows=nonEmptyRows;
    state.upload.headerRowIdx=guessHeaderRow(nonEmptyRows);
    const headerRow=nonEmptyRows[state.upload.headerRowIdx]||[];
    state.upload.mapping=guessColumnMap(headerRow,FIELD_TARGETS[state.upload.type]);
    state.upload.stage="preview";
  }catch(err){
    state.upload.error=err.message||"Could not read this file.";
  }
  state.upload.busy=false;
  input.value="";
  render();
}
async function performImport(replaceExisting){
  const u=state.upload, type=u.type;
  const headerRow=u.rawRows[u.headerRowIdx]||[];
  const dataRows=u.rawRows.slice(u.headerRowIdx+1);
  const mapping=u.mapping;
  const tIdCol=mapping.ticketId;
  if(tIdCol===null||tIdCol===undefined){ alert("Please map the Ticket ID column before importing — it's required to detect duplicates."); return; }
  if(replaceExisting) state.datasets[type]=[];
  const existingIds=new Set(state.datasets[type].map(r=>String(r.ticketId)));
  const seenInFile=new Set();
  let total=0,imported=0,duplicates=0;
  const newRecords=[];
  dataRows.forEach(row=>{
    if(!row||row.every(c=>c===null||c===undefined||String(c).trim()==="")) return;
    total++;
    const ticketIdRaw=row[tIdCol];
    if(ticketIdRaw===null||ticketIdRaw===undefined||String(ticketIdRaw).trim()===""){ return; }
    const tid=String(ticketIdRaw).trim();
    if(existingIds.has(tid)||seenInFile.has(tid)){ duplicates++; return; }
    seenInFile.add(tid);
    const rec={ticketId:tid};
    Object.keys(mapping).forEach(f=>{
      const idx=mapping[f];
      rec[f]=(idx!==null&&idx!==undefined)?row[idx]:null;
    });
    if(type==="fieldvisit"){
      if(rec.openTime!==null&&rec.openTime!==undefined&&rec.openDate!==null&&rec.openDate!==undefined){
        rec.openDate=combineDateAndTime(rec.openDate,rec.openTime);
      }
      if(rec.solvedTime!==null&&rec.solvedTime!==undefined&&rec.solvedDate!==null&&rec.solvedDate!==undefined){
        rec.solvedDate=combineDateAndTime(rec.solvedDate,rec.solvedTime);
      }
      delete rec.openTime;
      delete rec.solvedTime;
    }
    const faField = type==="installation" ? "installedBy" : "solvedBy";
    if(rec[faField]) rec[faField]=canonicalListName("fas", rec[faField]);
    if(rec.olt) rec.olt=String(rec.olt).trim();
    newRecords.push(rec);
    imported++;
  });
  let listsChangedOnImport=false;
  newRecords.forEach(r=>{
    const faField = type==="installation" ? "installedBy" : "solvedBy";
    if(ensureListHas("fas", r[faField])) listsChangedOnImport=true;
    if(ensureListHas("olts", r.olt)) listsChangedOnImport=true;
  });
  if(listsChangedOnImport){
    await sSet("config:fas",JSON.stringify(state.lists.fas),true).catch(()=>{});
    await sSet("config:olts",JSON.stringify(state.lists.olts),true).catch(()=>{});
  }
  state.datasets[type]=state.datasets[type].concat(newRecords);
  state.columnMaps[type]=mapping;
  await sSet("dataset:"+type,JSON.stringify(state.datasets[type]),true);
  await sSet("column_map:"+type,JSON.stringify(mapping),true);
  const dateField = type==="installation" ? "createDate" : "solvedDate";
  const lastDataDate=computeMaxDateInRecords(newRecords,dateField);
  const histEntry={id:newId(),type,fileName:u.fileName,date:new Date().toISOString(),uploadedBy:"You",total,imported,duplicates,replaced:!!replaceExisting,lastDataDate};
  state.uploadHistory.unshift(histEntry);
  await sSet("upload_history",JSON.stringify(state.uploadHistory),true);
  state.upload.result={total,imported,duplicates,lastDataDate};
  state.upload.stage="done";
  render();
}

function formatLocalDateTime(isoStr){
  if(!isoStr) return "";
  const d=new Date(isoStr);
  if(isNaN(d.getTime())) return isoStr;
  return d.toLocaleString();
}
function renderLastUploaded(type){
  const last=state.uploadHistory.find(h=>h.type===type);
  if(!last){
    return `<div class="hint" style="margin-bottom:12px;">No ${DATASET_LABELS[type]} file has been uploaded yet.</div>`;
  }
  const niceDate=formatLocalDateTime(last.date);
  const dataThrough = last.lastDataDate ? ` — data through <strong>${esc(last.lastDataDate)}</strong>` : "";
  return `<div class="hint" style="margin-bottom:12px;">Last uploaded: <strong>${esc(niceDate)}</strong> — ${esc(last.fileName)} (${last.imported} added, ${last.duplicates} duplicates skipped)${last.replaced?' — replaced previous data':''}${dataThrough}</div>`;
}

function computeAuditMatch(source,nepYear,nepMonth){
  const auditedIds=new Set(state.dashboard.audits.map(a=>String(a.customerId)));
  source=source||state.pending.source;
  let rows=state.datasets[source]||[];
  if(nepYear||nepMonth){
    const dateField = source==="installation" ? "createDate" : "solvedDate";
    rows=rows.filter(r=>{
      const d=parseDateVal(r[dateField]);
      if(!d) return false;
      const ni=nepInfo(ymd(d));
      if(!ni) return false;
      if(nepYear && String(ni.year)!==nepYear) return false;
      if(nepMonth && ni.month!==nepMonth) return false;
      return true;
    });
  }
  const solved=[],pendingList=[];
  rows.forEach(r=>{
    if(auditedIds.has(String(r.ticketId))) solved.push(r); else pendingList.push(r);
  });
  return {solved,pending:pendingList};
}
function renderPending(){
  const p=state.pending;
  const {solved,pending}=computeAuditMatch();
  const auditedIds=new Set(state.dashboard.audits.map(a=>String(a.customerId)));
  let list = p.view==="solved" ? solved : p.view==="pending" ? pending : solved.concat(pending);
  if(p.fOlt) list=list.filter(r=>r.olt===p.fOlt);
  const pendingDateField=p.source==="fieldvisit"?"solvedDate":"createDate";
  if(p.fNepYear||p.fNepMonth){
    list=list.filter(r=>{
      const d=parseDateVal(r[pendingDateField]);
      if(!d) return false;
      const ni=nepInfo(ymd(d));
      if(!ni) return false;
      if(p.fNepYear&&String(ni.year)!==p.fNepYear) return false;
      if(p.fNepMonth&&ni.month!==p.fNepMonth) return false;
      return true;
    });
  }
  if(p.fDateFrom||p.fDateTo){
    list=list.filter(r=>{
      const d=parseDateVal(r[pendingDateField]);
      if(!d) return false;
      const dayStr=ymd(d);
      if(p.fDateFrom && dayStr<p.fDateFrom) return false;
      if(p.fDateTo && dayStr>p.fDateTo) return false;
      return true;
    });
  }
  if(p.q){
    const s=p.q.toLowerCase();
    list=list.filter(r=>`${r.username||''} ${r.ticketId||''}`.toLowerCase().includes(s));
  }
  /* Sorted newest-first by date by default — except in the Pending Audit view, where the
     most-aged (oldest, i.e. most overdue) tickets should surface first so the aging
     highlight actually helps prioritize. */
  list=list.slice().sort((a,b)=>{
    const da=parseDateVal(a[pendingDateField]), db=parseDateVal(b[pendingDateField]);
    if(!da&&!db) return 0;
    if(!da) return 1;
    if(!db) return -1;
    return p.view==='pending' ? (da-db) : (db-da);
  });
  const oltOptions=Array.from(new Set((state.datasets[p.source]||[]).map(r=>r.olt).filter(Boolean))).sort();
  const nepOpts=nepFilterOptionsFromMap();
  const viewLabel = p.view==='pending' ? 'Pending Audit' : p.view==='solved' ? 'Solved / Already Audited' : 'All (Pending + Solved)';

  return `<div>
    <h2 style="margin:0 0 4px;">Pending Audit</h2>

function normalizeSolution(s){
  if(!s) return "";
  return String(s).trim().toLowerCase().replace(/\.+$/,"").replace(/\s+/g," ");
}
/* Some solutions are worded differently but describe the same underlying fix — a
   disconnected/unplugged connector being reconnected. Grouping them under one family lets
   VS Report treat "the connector is plugged into the splitter", "...into the router", and
   "the connector was unplug due to disable, now repluged and fine" as the same repeat
   pattern instead of missing each other as distinct exact strings. */
function solutionFamily(s){
  const n=normalizeSolution(s);
  if(!n) return n;
  /* Only these two exact solutions are treated as the same underlying fix — "plugged into
     the splitter" and "unplug due to disable, now repluged" both describe reconnecting a
     disconnected connector at the client/splitter end. Deliberately exact-match only (not
     a broad "connector" + "plugged into" pattern) so a different fix like "plugged into
     the router" is NOT folded in here — that's a distinct problem. */
  if(n==="the connector is plugged into the splitter" || n==="the connector was unplug due to disable, now repluged and fine"){
    return "connector reconnected";
  }
  return n;
}
function normalizeDiag(s){ return s?String(s).trim().toLowerCase():""; }
function parseDateVal(v){
  if(v===null||v===undefined||v==="") return null;
  if(v instanceof Date) return isNaN(v.getTime())?null:v;
  if(typeof v==="number"){
    const wholeDays=Math.floor(v);
    const fracDay=v-wholeDays;
    const base=new Date(1899,11,30);
    base.setDate(base.getDate()+wholeDays);
    const totalSeconds=Math.round(fracDay*86400);
    const hh=Math.floor(totalSeconds/3600), mi=Math.floor((totalSeconds%3600)/60), ss=totalSeconds%60;
    const d=new Date(base.getFullYear(),base.getMonth(),base.getDate(),hh,mi,ss);
    return isNaN(d.getTime())?null:d;
  }
  const s=String(v).trim();
  if(!s) return null;
  const iso=s.match(/^(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
  if(iso){
    const y=parseInt(iso[1],10), mo=parseInt(iso[2],10), da=parseInt(iso[3],10);
    const hh=iso[4]?parseInt(iso[4],10):0, mi=iso[5]?parseInt(iso[5],10):0, ss=iso[6]?parseInt(iso[6],10):0;
    const d=new Date(y,mo-1,da,hh,mi,ss);
    if(!isNaN(d.getTime())) return d;
  }
  let d=new Date(s);
  if(!isNaN(d.getTime())) return d;
  const m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
  if(m){
    let day=parseInt(m[1],10), month=parseInt(m[2],10), year=parseInt(m[3],10);
    if(year<100) year+=2000;
    if(month>12 && day<=12){ const t=day; day=month; month=t; }
    const hh=m[4]?parseInt(m[4],10):0, mi=m[5]?parseInt(m[5],10):0, ss=m[6]?parseInt(m[6],10):0;
    d=new Date(year,month-1,day,hh,mi,ss);
    if(!isNaN(d.getTime())) return d;
  }
  return null;
}
function combineDateAndTime(dateVal,timeVal){
  if(dateVal===null||dateVal===undefined||dateVal==="") return dateVal;
  if(timeVal===null||timeVal===undefined||timeVal==="") return dateVal;
  if(typeof dateVal==="number"&&typeof timeVal==="number"){
    const dPart=Math.floor(dateVal);
    const tPart=timeVal-Math.floor(timeVal);
    return dPart+tPart;
  }
  const dd=parseDateVal(dateVal);
  if(!dd) return dateVal;
  let hh=0,mi=0,ss=0;
  if(typeof timeVal==="number"){
    const totalSec=Math.round(timeVal*86400);
    hh=Math.floor(totalSec/3600); mi=Math.floor((totalSec%3600)/60); ss=totalSec%60;
  } else {
    const tm=String(timeVal).trim().match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?/);
    if(!tm) return dateVal;
    hh=parseInt(tm[1],10); mi=parseInt(tm[2],10); ss=tm[3]?parseInt(tm[3],10):0;
  }
  return `${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,"0")}-${String(dd.getDate()).padStart(2,"0")} ${String(hh).padStart(2,"0")}:${String(mi).padStart(2,"0")}:${String(ss).padStart(2,"0")}`;
}
function daysBetween(d1,d2){ return Math.round((d2-d1)/(1000*60*60*24)); }
function computeMaxDateInRecords(records,dateField){
  let max=null;
  (records||[]).forEach(r=>{
    const d=parseDateVal(r[dateField]);
    if(d && (!max||d>max)) max=d;
  });
  return max?ymd(max):null;
}
function computeDataFreshness(type){
  const dateField = type==="installation" ? "createDate" : "solvedDate";
  const lastDate=computeMaxDateInRecords(state.datasets[type],dateField);
  if(!lastDate) return null;
  const gapDays=Math.round((new Date(ymd(new Date()))-new Date(lastDate))/(1000*60*60*24));
  return {lastDate,gapDays};
}

  return {mapped,totalRows:rows.length,withRawValues,withParsedDates};
}
function combinedTicketStream(){
  const inst=(state.datasets.installation||[]).map(r=>({
    username:r.username,ticketId:r.ticketId,olt:r.olt,fa:r.installedBy,
    problemType:"New Installation",diagnosed:"New Installation",solution:null,

  })).filter(r=>r.date);
  const fv=(state.datasets.fieldvisit||[]).map(r=>({
    username:r.username,ticketId:r.ticketId,olt:r.olt,splitter:r.splitter,fa:r.solvedBy,
    problemType:r.problemType,diagnosed:r.diagnosed,solution:r.solution,

  })).filter(r=>r.date);

function computeVsMatches(condA,condB,trackedDays,sameTypeDistinct){
  const all=combinedTicketStream();
  const byUser={};
  all.forEach(r=>{
    const u=r.username||r.ticketId;
    if(!u) return;
    if(!byUser[u]) byUser[u]=[];
    byUser[u].push(r);
  });
  const matches=[];
  Object.entries(byUser).forEach(([user,tix])=>{
    const sorted=tix.slice().sort((a,b)=>a.date-b.date);
    for(let i=0;i<sorted.length;i++){
      /* Both the original ticket AND the repeat must fall inside the selected Nepali
         Year/Month — filtering to a month should scope the whole pattern to that month's
         activity, not just require the repeat to land there while the original ticket
         could be from any earlier month. */
      if(!passesNepFilter(sorted[i].date)) continue;
      if(!condA(sorted[i])) continue;
      for(let j=i+1;j<sorted.length;j++){
        if(sameTypeDistinct && j===i) continue;
        if(!passesNepFilter(sorted[j].date)) continue;
        if(!condB(sorted[j])) continue;
        const diff=daysBetween(sorted[i].date,sorted[j].date);
        if(diff>=0&&diff<=trackedDays){
          matches.push({user,first:sorted[i],second:sorted[j],days:diff});
          break;
        }
      }
    }
  });
  return matches;
}
function vsReportDefs(){
  return [
    {id:"r1",title:"New Installation → No Internet Connection",
      needs:["problemType"],
      condA:t=>t.problemType==="New Installation",
      condB:t=>normalizeDiag(t.problemType).includes("no internet")},
    {id:"r2",title:"Splicing (2mm fiber holder) → No Internet Connection",
      needs:["solution","problemType"],
      condA:t=>normalizeSolution(t.solution)==="splicing done using 2mm fiber holder",
      condB:t=>normalizeDiag(t.problemType).includes("no internet")},
    {id:"r3",title:"No Internet Connection → No Internet Connection",
      needs:["problemType"],
      condA:t=>normalizeDiag(t.problemType).includes("no internet"),
      condB:t=>normalizeDiag(t.problemType).includes("no internet"),
      sameTypeDistinct:true},
    {id:"r4",title:"Fiber Cable Changed → Splicing (2mm fiber holder)",
      needs:["solution"],
      condA:t=>normalizeSolution(t.solution)==="fiber cable changed",
      condB:t=>normalizeSolution(t.solution)==="splicing done using 2mm fiber holder"},
    {id:"r5",title:"Connector Reconnected → Connector Reconnected",
      needs:["solution"],
      condA:t=>solutionFamily(t.solution)==="connector reconnected",
      condB:t=>solutionFamily(t.solution)==="connector reconnected",
      sameTypeDistinct:true}
  ];
}
function computeFaRepeatStats(trackedDays){
  const defs=vsReportDefs();
  const emptyReportCounts=()=>{ const o={}; defs.forEach(d=>o[d.id]=0); return o; };
  const byFa={};
  const overallByReport=emptyReportCounts();
  let overallTotal=0;
  const claimedSecondTicketIds=new Set();
  defs.forEach(d=>{
    const matches=computeVsMatches(d.condA,d.condB,trackedDays,d.sameTypeDistinct);
    matches.forEach(m=>{
      const secondId=String(m.second.ticketId);
      if(claimedSecondTicketIds.has(secondId)) return;
      claimedSecondTicketIds.add(secondId);
      const fa=m.first.fa||"Unknown";
      if(!byFa[fa]) byFa[fa]={fa,total:0,byReport:emptyReportCounts(),tickets:[]};
      byFa[fa].total++;
      byFa[fa].byReport[d.id]++;
      byFa[fa].tickets.push({reportId:d.id,reportTitle:d.title,user:m.user,olt:m.first.olt,
        firstTicket:m.first.ticketId,firstDate:m.first.date,secondTicket:m.second.ticketId,secondDate:m.second.date,days:m.days});
      overallByReport[d.id]++;
      overallTotal++;
    });
  });
  const list=Object.values(byFa).sort((a,b)=>b.total-a.total);
  return {list,overallByReport,overallTotal};
}

function computeDistributionRepetition(trackedDays){
  const fv=(state.datasets.fieldvisit||[]).map(r=>({
    username:r.username,ticketId:r.ticketId,splitter:r.splitter||r.olt||"Unknown",olt:r.olt||"—",
    date:parseDateVal(r.solvedDate)
  })).filter(r=>r.date&&r.username);
  const byUser={};
  fv.forEach(r=>{ if(!byUser[r.username]) byUser[r.username]=[]; byUser[r.username].push(r); });
  const bySplitter={};
  Object.values(byUser).forEach(tix=>{
    if(tix.length<2) return;
    const sorted=tix.slice().sort((a,b)=>a.date-b.date);
    for(let i=0;i<sorted.length-1;i++){
      /* Both visits must fall inside the selected Nepali Year/Month filter, same as VS
         Report — filtering to a month scopes the whole repeat pattern to that month, not
         just the second visit. */
      if(!passesNepFilter(sorted[i].date)) continue;
      const diff=daysBetween(sorted[i].date,sorted[i+1].date);
      if(diff>=0&&diff<=trackedDays&&passesNepFilter(sorted[i+1].date)){
        const sp=sorted[i].splitter;
        if(!bySplitter[sp]) bySplitter[sp]={splitter:sp,olts:new Set(),users:new Set(),tickets:0,details:[]};
        bySplitter[sp].olts.add(sorted[i].olt);
        bySplitter[sp].users.add(sorted[i].username);
        bySplitter[sp].tickets+=2;
        bySplitter[sp].details.push({user:sorted[i].username,d1:sorted[i].date,d2:sorted[i+1].date,days:diff});
      }
    }
  });
  return Object.values(bySplitter).map(g=>({splitter:g.splitter,olt:Array.from(g.olts).join(", "),repeatedUserCount:g.users.size,totalTickets:g.tickets,details:g.details}))
    .sort((a,b)=>b.repeatedUserCount-a.repeatedUserCount);
}
function computeUserMonthTrend(){
  /* Which two months to compare — the same "latest month with data" vs "the one right
     before it" logic used by Ticket Projection, so the trend arrow means the same thing
     everywhere in the app. */
  const dateField=projectionDateField();
  const eligible=computeMonthsWithData(dateField).filter(mm=>NEP_MONTH_ORDER.indexOf(mm)>0);
  if(!eligible.length) return null;
  const currentMonth=eligible[eligible.length-1];
  const idx=NEP_MONTH_ORDER.indexOf(currentMonth);
  const prevMonth=NEP_MONTH_ORDER[idx-1];
  const currYear=nepMonthYearOf(currentMonth), prevYear=nepMonthYearOf(prevMonth);
  if(currYear==null||prevYear==null) return null;
  const byUserCurr={}, byUserPrev={};
  (state.datasets.fieldvisit||[]).forEach(r=>{
    if(!r.username) return;
    const d=parseDateVal(r[dateField]);
    if(!d) return;
    const ni=nepInfo(ymd(d));
    if(!ni) return;
    if(ni.month===currentMonth&&ni.year===currYear) byUserCurr[r.username]=(byUserCurr[r.username]||0)+1;
    else if(ni.month===prevMonth&&ni.year===prevYear) byUserPrev[r.username]=(byUserPrev[r.username]||0)+1;
  });
  return {currentMonth,prevMonth,byUserCurr,byUserPrev};
}
function userTrendBadge(trend,username){
  if(!trend) return "";
  const prevCount=trend.byUserPrev[username]||0, currCount=trend.byUserCurr[username]||0;
  if(prevCount===0&&currCount===0) return "";
  const title=`${trend.prevMonth}: ${prevCount} → ${trend.currentMonth}: ${currCount}`;
  if(prevCount===0&&currCount>0) return `<span style="color:var(--bad);font-weight:800;font-size:11px;" title="New this month — ${esc(title)}">🆕 New</span>`;
  if(currCount>prevCount) return `<span style="color:var(--bad);font-weight:800;font-size:12px;" title="${esc(title)}">▲ Rising</span>`;
  if(currCount<prevCount) return `<span style="color:var(--good);font-weight:800;font-size:12px;" title="${esc(title)}">▼ Falling</span>`;
  return `<span style="color:var(--sub);font-weight:700;font-size:12px;" title="${esc(title)}">→ Same</span>`;
}
function computeTopComplainUsers(minCount){
  /* Every repeat complainer (2+ tickets by default), not just a top-N cutoff — a user
     with 4, 3, or 2 tickets matters just as much as the top 5 and should never be
     silently excluded. */
  minCount = minCount==null ? 2 : minCount;
  const counts={};
  (state.datasets.fieldvisit||[]).forEach(r=>{
    if(!r.username) return;
    if(!counts[r.username]) counts[r.username]={username:r.username,count:0,olts:new Set(),tickets:[]};
    counts[r.username].count++;
    if(r.olt) counts[r.username].olts.add(r.olt);
    counts[r.username].tickets.push({ticketId:r.ticketId,olt:r.olt,problemType:r.problemType,diagnosed:r.diagnosed,solvedDate:r.solvedDate});
  });
  return Object.values(counts).filter(u=>u.count>=minCount).sort((a,b)=>b.count-a.count)
    .map(u=>({username:u.username,count:u.count,olt:Array.from(u.olts).join(", "),tickets:u.tickets}));
}

/* ===== OLT Health Score =====
   Combines four signals per OLT — ticket volume, avg solve time (ASD), repeat-ticket
   rate, and SLA breach rate (>24 hrs) — into one 0-100 score so the worst-performing
   OLT is visible at a glance instead of reading four separate reports. */
function computeOltRepeatRateMap(trackedDays){
  const fv=(state.datasets.fieldvisit||[]).map(r=>({username:r.username,olt:r.olt||"—",date:parseDateVal(r.solvedDate)}))
    .filter(r=>r.date&&r.username&&passesNepFilter(r.date));
  const byUser={};
  fv.forEach(r=>{ if(!byUser[r.username]) byUser[r.username]=[]; byUser[r.username].push(r); });
  const byOlt={};
  const ensure=o=>{ if(!byOlt[o]) byOlt[o]={ticketsConsidered:0,repeats:0}; return byOlt[o]; };
  Object.values(byUser).forEach(tix=>{
    const sorted=tix.slice().sort((a,b)=>a.date-b.date);
    for(let i=0;i<sorted.length;i++){
      const g=ensure(sorted[i].olt);
      g.ticketsConsidered++;
      if(i<sorted.length-1){
        const diff=daysBetween(sorted[i].date,sorted[i+1].date);
        if(diff>=0&&diff<=trackedDays) g.repeats++;
      }
    }
  });
  return byOlt;
}
function healthGrade(score){
  if(score==null) return {label:"—",color:"var(--sub)"};
  if(score>=75) return {label:"Healthy",color:"var(--good)"};
  if(score>=50) return {label:"Watch",color:"var(--warn)"};
  return {label:"Needs Attention",color:"var(--bad)"};
}
function computeOltHealthScore(trackedDays){
  const fv=(state.datasets.fieldvisit||[]).filter(r=>passesNepFilter(r.solvedDate));
  if(!fv.length) return [];
  const agg={};
  fv.forEach(r=>{
    const o=r.olt||"—";
    if(!agg[o]) agg[o]={olt:o,ticketCount:0,hrSum:0,hrCount:0,breach24:0};
    agg[o].ticketCount++;
    const hv=parseFloat(r.solveDurHr);
    if(!isNaN(hv)){ agg[o].hrSum+=hv; agg[o].hrCount++; if(hv>24) agg[o].breach24++; }
  });
  const repeatByOlt=computeOltRepeatRateMap(trackedDays);
  const rows=Object.values(agg).map(g=>{
    const avgHr = g.hrCount? g.hrSum/g.hrCount : null;
    const breachPct = g.hrCount? 100*g.breach24/g.hrCount : 0;
    const rep=repeatByOlt[g.olt];
    const repeatPct = rep&&rep.ticketsConsidered? 100*rep.repeats/rep.ticketsConsidered : 0;
    return {olt:g.olt, ticketCount:g.ticketCount, avgHr, breachPct, repeatPct};
  });
  const maxCount=Math.max(1,...rows.map(r=>r.ticketCount));
  const hrValues=rows.map(r=>r.avgHr).filter(v=>v!=null);
  const maxHr=Math.max(1,...hrValues);
  rows.forEach(r=>{
    const volumeScore=100*(1-r.ticketCount/maxCount);
    const asdScore = r.avgHr==null ? null : 100*Math.max(0,1-r.avgHr/maxHr);
    const repeatScore=100-Math.min(100,r.repeatPct);
    const slaScore=100-Math.min(100,r.breachPct);
    const parts=[volumeScore,repeatScore,slaScore]; if(asdScore!=null) parts.push(asdScore);
    r.healthScore=Math.round(parts.reduce((s,v)=>s+v,0)/parts.length);
  });
  return rows.sort((a,b)=>a.healthScore-b.healthScore);
}

/* ===== FA Workload Balance =====
   Ticket count per FA (Installed By + Solved By combined) vs the team average, so an
   overloaded or underutilized FA is easy to spot. */
function computeFaWorkload(){
  const all=combinedTicketStream().filter(r=>passesNepFilter(r.date));
  const counts={};
  all.forEach(r=>{ const fa=r.fa||"Unknown"; counts[fa]=(counts[fa]||0)+1; });
  const entries=Object.entries(counts);
  const total=entries.reduce((s,[,v])=>s+v,0);
  const avg=entries.length?total/entries.length:0;
  const rows=entries.map(([fa,count])=>{
    const pctOfTotal= total?100*count/total:0;
    const vsAvgPct= avg? 100*(count-avg)/avg : 0;
    let status="Balanced", color="var(--good)";
    if(avg>0){
      if(count>=avg*1.3){ status="Overloaded"; color="var(--bad)"; }
      else if(count<=avg*0.7){ status="Underutilized"; color="var(--warn)"; }
    }
    return {fa,count,pctOfTotal,vsAvgPct,status,color};
  }).sort((a,b)=>b.count-a.count);
  return {rows,total,avg,faCount:entries.length};
}

function computeDiagCountsForPareto(){
  const fv=(state.datasets.fieldvisit||[]).filter(r=>passesNepFilter(r.solvedDate));
  const diagCounts={};
  fv.forEach(r=>{ if(r.diagnosed){ const k=normalizeDiag(r.diagnosed); diagCounts[k]=(diagCounts[k]||0)+1; } });
  const diagTotal=Object.values(diagCounts).reduce((s,v)=>s+v,0);

/* --- New vs Repeat Ticket Ratio Trend --- */
function computeNewVsRepeatTrend(trackedDays){
  const fv=(state.datasets.fieldvisit||[]).map(r=>({username:r.username,date:parseDateVal(r.solvedDate)})).filter(r=>r.date&&r.username);
  const byUser={};
  fv.forEach(r=>{ if(!byUser[r.username]) byUser[r.username]=[]; byUser[r.username].push(r); });
  const byMonth={};
  Object.values(byUser).forEach(tix=>{
    const sorted=tix.slice().sort((a,b)=>a.date-b.date);
    for(let i=0;i<sorted.length;i++){
      if(!passesNepFilter(sorted[i].date)) continue;
      let isRepeat=false;
      if(i>0){
        const diff=daysBetween(sorted[i-1].date,sorted[i].date);
        if(diff>=0&&diff<=trackedDays) isRepeat=true;
      }
      const ni=nepInfo(ymd(sorted[i].date));
      const mo=ni?ni.month:"—";
      if(!byMonth[mo]) byMonth[mo]={newCount:0,repeatCount:0};
      if(isRepeat) byMonth[mo].repeatCount++; else byMonth[mo].newCount++;
    }
  });
  return NEP_MONTH_ORDER.filter(m=>byMonth[m]).map(m=>{
    const g=byMonth[m]; const total=g.newCount+g.repeatCount;
    return {month:m,newCount:g.newCount,repeatCount:g.repeatCount,total,repeatPct: total?100*g.repeatCount/total:0};
  });
}
/* --- Splitter/Distribution Month-wise Trend --- */
function computeSplitterMonthTrend(trackedDays){
  const fv=(state.datasets.fieldvisit||[]).map(r=>({username:r.username,splitter:r.splitter||r.olt||"Unknown",date:parseDateVal(r.solvedDate)})).filter(r=>r.date&&r.username);
  const byUser={};

      const diff=daysBetween(sorted[i].date,sorted[i+1].date);

/* --- Power Level vs Repeat Ticket Correlation --- */
function computePlVsRepeat(trackedDays){
  const hasDirectPL=(state.columnMaps.fieldvisit||{}).powerLevel!=null;
  const fv=(state.datasets.fieldvisit||[]).map(r=>({ticketId:r.ticketId,username:r.username,date:parseDateVal(r.solvedDate),powerLevel:r.powerLevel})).filter(r=>r.date&&r.username);
  const byUser={};
  fv.forEach(r=>{ if(!byUser[r.username]) byUser[r.username]=[]; byUser[r.username].push(r); });
  const repeatTicketIds=new Set();
  Object.values(byUser).forEach(tix=>{
    const sorted=tix.slice().sort((a,b)=>a.date-b.date);
    for(let i=0;i<sorted.length-1;i++){
      const diff=daysBetween(sorted[i].date,sorted[i+1].date);
      if(diff>=0&&diff<=trackedDays) repeatTicketIds.add(String(sorted[i].ticketId));
    }
  });
  const good={total:0,repeat:0}, bad={total:0,repeat:0};
  let matchedCount=0, source="none";
  if(hasDirectPL){
    /* Preferred path: Power Level uploaded directly on the Field Visit row itself — no
       join needed, so every ticket with a PL value counts, not just audited ones. */
    fv.forEach(r=>{
      const q=plQuality(r.powerLevel);
      if(!q) return;
      matchedCount++;
      const isRepeat=repeatTicketIds.has(String(r.ticketId));
      const bucket=q==="Good"?good:bad;
      bucket.total++; if(isRepeat) bucket.repeat++;
    });
    source="fieldvisit";
  } else {
    /* Fallback: no direct PL column mapped — join via Desk/Field Audit records that
       share a Ticket ID with a Field Visit row (audits only, so usually a smaller sample). */
    const fvTicketIds=new Set(fv.map(r=>String(r.ticketId)));
    const audits=(state.dashboard.audits||[]).filter(a=>a.powerLevel && fvTicketIds.has(String(a.customerId)));
    audits.forEach(a=>{
      const q=plQuality(a.powerLevel);
      if(!q) return;
      matchedCount++;
      const isRepeat=repeatTicketIds.has(String(a.customerId));
      const bucket=q==="Good"?good:bad;
      bucket.total++; if(isRepeat) bucket.repeat++;
    });
    source="audit";
  }
  return {good,bad,matchedCount,source};
}
/* ===== FA / Team — Power Level performance =====
   Per FA (Solved By): how many tickets they handled at Good vs Bad Power Level, and —
   the real "who handles tough cases well" signal — their average solve time specifically
   on Bad-PL (weak signal) tickets, since those are the harder fixes. */
function computeFaPlPerformance(){
  const fv=(state.datasets.fieldvisit||[]).filter(r=>passesNepFilter(r.solvedDate) && r.powerLevel!=null && String(r.powerLevel).trim()!=="");
  const byFa={};
  fv.forEach(r=>{
    const pl=parseFloat(r.powerLevel);
    if(isNaN(pl)) return;
    const fa=r.solvedBy||"Unknown";
    if(!byFa[fa]) byFa[fa]={fa,count:0,plSum:0,goodCount:0,badCount:0,badAsdSum:0,badAsdCount:0};
    const g=byFa[fa];
    g.count++; g.plSum+=pl;
    const q=plQuality(pl);
    if(q==="Good") g.goodCount++;
    else if(q==="Bad"){
      g.badCount++;
      const h=parseFloat(r.solveDurHr);
      if(!isNaN(h)){ g.badAsdSum+=h; g.badAsdCount++; }
    }
  });
  return Object.values(byFa).map(g=>({
    fa:g.fa, count:g.count,
    avgPl: g.count? g.plSum/g.count : null,
    goodCount:g.goodCount, badCount:g.badCount,
    badPct: g.count? 100*g.badCount/g.count : 0,
    badAvgAsd: g.badAsdCount? g.badAsdSum/g.badAsdCount : null
  })).sort((a,b)=>{
    const av=a.badAvgAsd==null?Infinity:a.badAvgAsd, bv=b.badAvgAsd==null?Infinity:b.badAvgAsd;
    return av-bv;
  });
}

function computeFirstTimeFixRate(trackedDays){

  return agg;
}

/* ===== Splitter Cascade Alert — ONU Offline, back-to-back on the same splitter =====
   When TWO DIFFERENT customers on the SAME splitter both get "ONU status offline"
   tickets close together in time, it's a strong signal the SPLITTER itself is bad,
   not each customer's individual ONU — worth flagging clearly and separately. */
function isOnuOfflineCause(diagnosed){
  const s=(diagnosed||"").toLowerCase();
  return s.includes("onu") && s.includes("offline");
}
function fmtDateTime(d){
  if(!d) return "—";
  const hasTime = d.getHours()!==0 || d.getMinutes()!==0 || d.getSeconds()!==0;
  const datePart=`${String(d.getDate()).padStart(2,"0")}-${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()]}-${d.getFullYear()}`;
  if(!hasTime) return datePart;
  const hh=d.getHours(), mi=String(d.getMinutes()).padStart(2,"0");
  const ampm=hh>=12?"PM":"AM";
  const hh12=((hh+11)%12)+1;
  return `${datePart} ${hh12}:${mi} ${ampm}`;
}
function computeSplitterCascade(windowHours,fromDate,toDate){
  windowHours = windowHours || 2;
  const fromD = fromDate ? parseDateVal(fromDate) : null;
  const toD = toDate ? parseDateVal(toDate) : null;
  if(toD) toD.setHours(23,59,59,999);
  const fv=(state.datasets.fieldvisit||[]).map(row=>({
    username:row.username, splitter:row.splitter||"Unknown", olt:row.olt||"—",
    diagnosed:row.diagnosed, ticketId:row.ticketId, solution:row.solution, solvedBy:row.solvedBy,
    solvedAt:parseDateVal(row.solvedDate), openAt:parseDateVal(row.openDate)
  })).filter(row=>{
    if(!row.solvedAt || !row.username) return false;
    if(fromD && row.solvedAt<fromD) return false;
    if(toD && row.solvedAt>toD) return false;
    return true;
  });
  const onuOffline=fv.filter(row=>isOnuOfflineCause(row.diagnosed));
  const bySplitter={};
  onuOffline.forEach(row=>{ if(!bySplitter[row.splitter]) bySplitter[row.splitter]=[]; bySplitter[row.splitter].push(row); });
  const results=[];
  Object.entries(bySplitter).forEach(([splitter,tix])=>{
    if(tix.length<2) return;
    for(let i=0;i<tix.length;i++){
      const a=tix[i];
      for(let j=0;j<tix.length;j++){
        if(i===j) continue;
        const b=tix[j];
        if(b.username===a.username) continue; /* must be a different customer */
        const bTime = b.openAt || b.solvedAt; /* prefer when the complaint came IN */
        if(!bTime) continue;
        const hoursGap=(bTime-a.solvedAt)/3600000;
        if(hoursGap<0 || hoursGap>windowHours) continue; /* b must land after a is closed, within the window */
        results.push({splitter, olt:a.olt, userA:a.username, ticketA:a.ticketId, solvedA:a.solvedAt, solutionA:a.solution, faA:a.solvedBy,
          userB:b.username, ticketB:b.ticketId, cameInB:bTime, hoursGap, solutionB:b.solution, faB:b.solvedBy});
      }
    }
  });
  return results.sort((a,b)=>a.hoursGap-b.hoursGap);
}
